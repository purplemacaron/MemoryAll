<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MemoryAll">
<title>MemoryAll</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifestLink">
<script>
/* 앱 아이콘·매니페스트를 파일 없이 코드로 생성 (단일 파일 구조) */
(function(){
  function makeIcon(size){
    const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d'),r=size*0.22,g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#6366f1');g.addColorStop(1,'#8b5cf6');
    x.fillStyle=g;x.beginPath();x.moveTo(r,0);
    x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);
    x.closePath();x.fill();
    x.fillStyle='#fff';x.font='700 '+(size*0.53)+'px Arial,sans-serif';
    x.textAlign='center';x.textBaseline='middle';x.fillText('M',size/2,size*0.54);
    return c.toDataURL('image/png');
  }
  const i192=makeIcon(192),i512=makeIcon(512);
  document.getElementById('favicon').href=i192;
  document.getElementById('appleIcon').href=makeIcon(180);
  const base=location.href.split('#')[0].split('?')[0];
  const mf={name:'MemoryAll',short_name:'MemoryAll',start_url:base,scope:new URL('./',base).href,display:'standalone',
    background_color:'#f6f7f9',theme_color:'#ffffff',
    icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
  document.getElementById('manifestLink').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
})();
</script>
<style>
/* 1. 디자인 토큰 */
:root{--bg:#f6f7f9;--panel:#fff;--line:#e7e9ee;--text:#16181d;--sub:#6b7280;--accent:#4f46e5;--accent-soft:#eef2ff;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;--r:14px;--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex-shrink:0}
code{background:#f3f4f6;padding:1px 5px;border-radius:5px;font-size:12.5px}
a{color:inherit}

/* 2. 레이아웃 */
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:block;padding:0 8px 18px;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text);user-select:text;-webkit-user-select:text;cursor:text}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--sub);text-decoration:none;font-weight:500}
.nav:hover{background:var(--bg);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grow{flex:1}
.pm{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px}
.pm .t{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}
.pm .m{font-size:12px;color:var(--sub)}
main{flex:1;min-width:0;padding:32px 36px 60px;max-width:1080px}
.topbar,.tabbar{display:none}

/* 3. 공통 컴포넌트 */
h1{font-size:24px;font-weight:750;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sub{color:var(--sub);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--sub);text-decoration:none;flex-shrink:0}
.icon-btn:hover{color:var(--text);background:var(--bg)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field{margin-bottom:14px}
.chk{width:auto;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.stat .n{font-size:26px;font-weight:750}
.stat .l{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.deck{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.deck:hover{border-color:#c7cbf5}
.deck .name{font-weight:700;font-size:15.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--sub);font-weight:600;white-space:nowrap}
.pill.b{background:#eff6ff;color:var(--blue)}.pill.g{background:#ecfdf5;color:var(--green)}.pill.r{background:#fef2f2;color:var(--red)}.pill.a{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.bigic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.bigic svg{width:26px;height:26px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);font-weight:600;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);user-select:none;margin:0}
.toggle.on{color:var(--accent);border-color:#c7cbf5;background:var(--accent-soft)}
.toggle svg{width:15px;height:15px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item .f{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .b{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* 4. 학습 화면 */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px 24px;font-size:22px;font-weight:600;user-select:none;touch-action:pan-y;transition:transform .2s}
.flash[data-act]{cursor:pointer}
.flash .ans{margin-top:22px;padding-top:22px;border-top:1px dashed var(--line);width:100%;font-size:18px;font-weight:500;color:#374151}
.flash .hint{margin-top:14px;font-size:14px;color:var(--amber);font-weight:500;display:flex;align-items:center;gap:6px}
.cloze{color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:6px}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gradebar .btn{flex-direction:column;gap:2px;padding:10px}
.gradebar small{font-weight:500;font-size:12px;opacity:.75}
.gr1{color:var(--red)!important}.gr2{color:var(--amber)!important}.gr3{color:var(--green)!important}.gr4{color:var(--blue)!important}
.choice{text-align:left;justify-content:flex-start;white-space:normal;font-weight:500;padding:12px 14px;width:100%}
.choice.ok{border-color:var(--green);background:#ecfdf5}
.choice.no{border-color:var(--red);background:#fef2f2}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.kbd{font-size:12px;color:var(--sub)}

/* 5. 튜터 채팅 */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;line-height:1.6;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.t{align-self:flex-start;font-size:12.5px;color:var(--sub);background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.msg pre{background:#f3f4f6;padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:13px}
.msg pre code{background:none;padding:0}
.msg ul,.msg ol{padding-left:20px;margin:4px 0}
.msg p{margin:4px 0}
.msg a{color:var(--accent)}
.src{font-size:12.5px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.src a{color:var(--accent);text-decoration:none}
.composer{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px}
.composer textarea{border:0;box-shadow:none;min-height:24px;max-height:160px;padding:8px;resize:none}

/* 6. 통계 */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:#eef0f4}
.heat i.l1{background:#c7d2fe}.heat i.l2{background:#818cf8}.heat i.l3{background:#6366f1}.heat i.l4{background:#4338ca}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars b{width:100%;max-width:36px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars span{font-size:11.5px;color:var(--sub)}
.bars em{font-style:normal;font-size:11.5px;font-weight:600}

/* 7. 모달·토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.modal h2{justify-content:space-between}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 8. 모바일 */
@media(max-width:820px){
  .side{display:none}
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .topbar .logo{padding:0;font-size:18px}
  main{padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
  h1{font-size:21px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);text-decoration:none;padding:4px 0;font-weight:600}
  .tabbar a.on{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .two{grid-template-columns:1fr}
  .flash{min-height:260px;font-size:20px;padding:28px 18px}
  .chat{height:calc(100vh - 240px)}
  .msg{max-width:90%}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">MemoryAll</div>
    <nav id="sideNav"></nav>
    <div class="grow"></div>
    <div class="pm">
      <div class="grow"><div class="m" id="pmMode">집중</div><div class="t" id="pmTime">25:00</div></div>
      <button class="icon-btn" data-act="pmToggle" id="pmToggle" title="시작/일시정지"></button>
      <button class="icon-btn" data-act="pmReset" id="pmReset" title="초기화"></button>
    </div>
  </aside>
  <header class="topbar">
    <div class="logo">MemoryAll</div>
    <div class="row" style="gap:8px"><button class="btn sm" data-act="pmToggle" id="pmMini"></button><a class="icon-btn" href="#settings" id="topSet" title="설정"></a></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 1. 유틸리티 ================= */
const $=s=>document.querySelector(s);
const DAY=864e5;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const safeUrl=u=>/^https?:\/\//i.test(String(u||''))?u:'#';
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isDesktop=()=>matchMedia('(min-width:821px)').matches;

// AI 응답에서 JSON 추출 (코드블록·앞뒤 잡담 대응)
function safeJSON(t){
  t=String(t??'');
  try{return JSON.parse(t)}catch{}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch{}}
  const a=t.indexOf('['),b=t.lastIndexOf(']');if(a>-1&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch{}}
  const c=t.indexOf('{'),d=t.lastIndexOf('}');if(c>-1&&d>c){try{return JSON.parse(t.slice(c,d+1))}catch{}}
  return null;
}
// 객체 안의 첫 번째 객체 배열 찾기
function findArr(o,d=0){
  if(Array.isArray(o)&&o.some(x=>x&&typeof x==='object'))return o;
  if(o&&typeof o==='object'&&d<4)for(const v of Object.values(o)){const r=findArr(v,d+1);if(r)return r}
  return null;
}
function plainText(x){const t=document.createElement('textarea');t.innerHTML=String(x||'').replace(/<[^>]+>/g,' ');return t.value.replace(/\s+/g,' ').trim()}

// 간단한 마크다운 (먼저 전부 escape → XSS 방지)
function md(src){
  const blocks=[];
  let s=esc(src).replace(/```\w*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre><code>'+c+'</code></pre>');return '\n\u0000'+(blocks.length-1)+'\u0000\n'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[];let list=null;
  for(const line of s.split('\n')){
    if(/^\u0000\d+\u0000$/.test(line)){if(list){out.push('</'+list+'>');list=null}out.push(line);continue}
    const ul=line.match(/^\s*[-*]\s+(.*)/),ol=line.match(/^\s*\d+[.)]\s+(.*)/),h=line.match(/^#{1,4}\s+(.*)/);
    const type=ul?'ul':ol?'ol':null;
    if(list&&list!==type){out.push('</'+list+'>');list=null}
    if(type){if(!list){out.push('<'+type+'>');list=type}out.push('<li>'+(ul||ol)[1]+'</li>')}
    else if(h)out.push('<p><b>'+h[1]+'</b></p>');
    else if(line.trim())out.push('<p>'+line+'</p>');
  }
  if(list)out.push('</'+list+'>');
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

let toastT;
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}
function openModal(html){$('#modal').innerHTML=html;$('#modalBg').classList.add('show')}
function closeModal(){$('#modalBg').classList.remove('show')}
function download(name,text,type='application/json'){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
// fetch + 타임아웃 + 알기 쉬운 오류
async function fetchJ(url,opt={},ms=60000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);let r,txt;
  try{r=await fetch(url,{...opt,signal:ctl.signal});txt=await r.text()}
  catch(e){throw new Error(e.name==='AbortError'?'요청 시간이 초과됐습니다':'연결 실패: 주소, CORS 설정, 네트워크를 확인하세요')}
  finally{clearTimeout(t)}
  if(!r.ok)throw new Error('HTTP '+r.status+': '+txt.slice(0,200));
  try{return JSON.parse(txt)}catch{throw new Error('JSON 응답이 아닙니다')}
}

/* ================= 2. 아이콘 (SVG, currentColor) ================= */
const ic=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  study:'<rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>',

function deckCounts(id){
  const end=startOfDay()+DAY;let total=0,due=0,nw=0;
  for(const c of S.cards){if(id&&c.deck!==id)continue;total++;if(!c.last)nw++;else if(c.due<end)due++}
  return {total,due,nw};
}
function logReview(ok,isNew){const k=dayKey(),l=S.log[k]||(S.log[k]={n:0,ok:0,nw:0});l.n++;if(ok)l.ok++;if(isNew)l.nw++}
function streak(){let s=0,t=startOfDay()+DAY/2;if(!S.log[dayKey(t)])t-=DAY;while(S.log[dayKey(t)]){s++;t-=DAY}return s}
function weakCards(n=10){return S.cards.filter(c=>c.last&&(c.lapses>0||c.ef<2.3)).sort((a,b)=>b.lapses-a.lapses||a.ef-b.ef).slice(0,n)}

// g: 1 다시, 2 어려움, 3 좋음, 4 쉬움 → 새 상태 반환 (원본 불변)
function nextState(c,g){
  let {iv=0,ef=2.5,reps=0,lapses=0}=c;const now=Date.now();
  if(g===1)return {...c,iv:0,ef:Math.max(1.3,ef-.2),reps:0,lapses:lapses+1,due:now+10*60e3,last:now};
  const q=g===2?3:g===3?4:5;
  ef=Math.max(1.3,ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  if(reps===0)iv=g===4?4:1;
  else if(reps===1)iv=g===2?3:g===3?6:8;
  else iv=Math.max(iv+1,Math.round(iv*(g===2?1.2:g===3?ef:ef*1.3)));
  return {...c,iv,ef,reps:reps+1,lapses,due:startOfDay()+iv*DAY,last:now};
}
function fmtIv(c,g){
  if(g===1)return '10분';
  const d=nextState(c,g).iv;
  return d<30?d+'일':d<365?Math.round(d/30)+'개월':(d/365).toFixed(1)+'년';
}
function buildQueue(id){
  const end=startOfDay()+DAY,pool=S.cards.filter(c=>!id||c.deck===id);
  const rev=pool.filter(c=>c.last&&c.due<end).sort((a,b)=>a.due-b.due).map(c=>c.id);
  const nw=pool.filter(c=>!c.last).sort((a,b)=>a.created-b.created).slice(0,newLimit());
  nw.forEach((c,i)=>rev.splice(Math.min(rev.length,i*4+3),0,c.id)); // 새 카드를 복습 사이에 섞음
  return rev;
}

// 모든 AI를 하나의 형식으로 호출 → {text, calls}
async function callLLM(messages,{tools=null,max=4096}={}){
  const a=S.settings.ai;
  if(!a.base||!a.model)throw new Error('설정에서 AI API 주소와 모델을 먼저 입력하세요');
  const base=a.base.trim().replace(/\/+$/,'').replace(/\/chat\/completions$/,'');
  if(a.provider==='anthropic'){
    const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n'),out=[];
    for(const m of messages){
      if(m.role==='system')continue;
      if(m.role==='tool'){
        const blk={type:'tool_result',tool_use_id:m.tool_call_id,content:String(m.content)},last=out[out.length-1];
        if(last&&last.role==='user'&&Array.isArray(last.content)&&last.content[0]?.type==='tool_result')last.content.push(blk);
        else out.push({role:'user',content:[blk]});
      }else if(m.role==='assistant'&&m.tool_calls){
        out.push({role:'assistant',content:[...(m.content?[{type:'text',text:m.content}]:[]),...m.tool_calls.map(t=>({type:'tool_use',id:t.id,name:t.function.name,input:safeJSON(t.function.arguments)||{}}))]});
      }else out.push({role:m.role,content:String(m.content??'')});
    }
    const body={model:a.model,max_tokens:max,messages:out};
    if(sys)body.system=sys;
    if(tools?.length)body.tools=tools.map(t=>({name:t.function.name,description:t.function.description,input_schema:t.function.parameters}));
    const d=await fetchJ(base+'/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)},300000);
    const bl=d.content||[];
    return {text:bl.filter(b=>b.type==='text').map(b=>b.text).join(''),calls:bl.filter(b=>b.type==='tool_use').map(b=>({id:b.id,type:'function',function:{name:b.name,arguments:JSON.stringify(b.input||{})}}))};
  }
  const h={'Content-Type':'application/json'};if(a.key)h.Authorization='Bearer '+a.key;
  const body={model:a.model,messages,max_tokens:max};if(tools?.length)body.tools=tools;
  const post=()=>fetchJ(base+'/chat/completions',{method:'POST',headers:h,body:JSON.stringify(body)},300000);
  let d;
  try{d=await post()}
  catch(e){ // 최신 OpenAI 모델은 max_completion_tokens를 요구
    if(!/max_completion_tokens/.test(e.message))throw e;
    delete body.max_tokens;body.max_completion_tokens=max;d=await post();
  }
  const m=d.choices?.[0]?.message||{};
  return {text:m.content||'',calls:m.tool_calls||[]};
}

// MCP (Streamable HTTP, JSON-RPC 2.0)
const MCP={};let MCP_MAP={},rpcId=0;
async function mcpRPC(srv,method,params,notify=false){
  const st=MCP[srv.id]||(MCP[srv.id]={});
  const h={'Content-Type':'application/json',Accept:'application/json, text/event-stream'};
  if(st.sid)h['Mcp-Session-Id']=st.sid;
  if(srv.token)h.Authorization='Bearer '+srv.token;
  const body={jsonrpc:'2.0',method};if(params)body.params=params;if(!notify)body.id=++rpcId;
  let r;
  try{r=await fetch(srv.url,{method:'POST',headers:h,body:JSON.stringify(body)})}
  catch{throw new Error('MCP 연결 실패: 주소와 서버의 CORS 설정을 확인하세요')}
  const sid=r.headers.get('mcp-session-id');if(sid)st.sid=sid;
  if(notify)return null;
  if(!r.ok)throw new Error('MCP HTTP '+r.status);
  const txt=await r.text();let msg=null;
  if((r.headers.get('content-type')||'').includes('text/event-stream')){
    for(const line of txt.split('\n'))if(line.startsWith('data:')){const j=safeJSON(line.slice(5).trim());if(j&&j.id===body.id)msg=j}
  }else msg=safeJSON(txt);
  if(!msg)throw new Error('MCP 응답을 해석할 수 없습니다');
  if(msg.error)throw new Error('MCP: '+(msg.error.message||'오류'));
  return msg.result;
}
async function mcpConnect(s){
  MCP[s.id]={};
  try{
    await mcpRPC(s,'initialize',{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'MemoryAll',version:'1.0'}});
    await mcpRPC(s,'notifications/initialized',null,true).catch(()=>{});
    const r=await mcpRPC(s,'tools/list',{});
    MCP[s.id].tools=r?.tools||[];
    return MCP[s.id].tools.length;
  }catch(e){MCP[s.id].err=e.message;throw e}
}
function mcpToolDefs(){
  MCP_MAP={};const out=[];
  S.settings.mcp.forEach((s,i)=>(MCP[s.id]?.tools||[]).forEach(t=>{
    const n=('m'+i+'_'+t.name).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,64);
    MCP_MAP[n]={srv:s,name:t.name};
    out.push({type:'function',function:{name:n,description:String(t.description||t.name).slice(0,1000),parameters:t.inputSchema?.type?t.inputSchema:{type:'object',properties:{}}}});
  }));
  return out.length?out:null;
}
async function mcpCall(n,args){
  const m=MCP_MAP[n];if(!m)throw new Error('알 수 없는 도구: '+n);
  const r=await mcpRPC(m.srv,'tools/call',{name:m.name,arguments:args});
  return (r?.content||[]).map(c=>c.type==='text'?c.text:JSON.stringify(c)).join('\n')||JSON.stringify(r);
}

/* ---------- 학습 ---------- */
const curCard=()=>ST&&S.cards.find(c=>c.id===ST.q[ST.i]);
const resetCardState=()=>Object.assign(ST,{show:false,hint:false,picked:null,choices:null,typed:null,correct:null});
function startStudy(arg){
  const id=arg&&arg!=='all'?arg:null;
  if(id&&!S.decks.some(d=>d.id===id)){location.hash='#home';return}
  ST={deck:id,q:buildQueue(id),i:0,done:0,mode:S.settings.mode||'flash'};resetCardState();drawStudy();
}
function makeChoices(c){
  const a=ansText(c);if(!a)return null;
  const pool=[...new Set(shuffle(S.cards.filter(x=>x.id!==c.id)).sort((x,y)=>(y.deck===c.deck)-(x.deck===c.deck)).map(ansText).filter(t=>t&&t!==a))].slice(0,3);
  return pool.length?shuffle([a,...pool]):null;
}
function drawStudy(){
  if(!ST)return;
  while(ST.i<ST.q.length&&!curCard())ST.i++;
  const deck=ST.deck&&S.decks.find(d=>d.id===ST.deck),title=deck?esc(deck.name):'전체 학습',back=deck?'#deck/'+deck.id:'#home';
  const c=curCard();
  if(!c){
    M(`<div class="head"><div class="row"><a class="icon-btn" href="${back}">${ic(I.back)}</a><h1>${title}</h1></div></div><div class="card empty">
    ${ST.done?`<div class="bigic" style="background:#ecfdf5;color:var(--green)">${ic(I.check)}</div><h2 style="justify-content:center">학습 완료</h2><p>${ST.done}장을 복습했어요. 연속 ${streak()}일째!</p>`
    :`<div class="bigic" style="background:var(--accent-soft);color:var(--accent)">${ic(I.clock)}</div><h2 style="justify-content:center">지금 학습할 카드가 없어요</h2><p>새 카드를 추가하거나 AI로 만들어 보세요.</p>`}
    <div class="row" style="justify-content:center;margin-top:18px"><a class="btn" href="#home">홈으로</a><a class="btn pri" href="#gen">${ic(I.spark)}AI로 카드 만들기</a></div></div>`);
    return;
  }
  const a=ansText(c),left=ST.q.length-ST.i,pct=ST.done/(ST.done+left)*100;
  let mode=ST.mode;
  if(mode==='quiz'){if(!ST.choices)ST.choices=makeChoices(c);if(!ST.choices)mode='flash'}
  if(mode==='type'&&!a)mode='flash';
  const aH=c.type==='cloze'?nl(c.front).replace(/\{\{(.+?)\}\}/g,'<span class="cloze">$1</span>')+(c.back?`<div class="sub" style="margin-top:10px">${nl(c.back)}</div>`:''):(nl(c.back)||'<span class="sub">(뒷면 없음)</span>');
  const qH=c.type==='cloze'?nl(c.front).replace(/\{\{(.+?)\}\}/g,'<span class="cloze">[ ? ]</span>'):nl(c.front);
  let act='';
  if(mode==='quiz')act=`<div class="stack" style="gap:8px;margin-bottom:12px">${ST.choices.map((t,i)=>`<button class="btn choice ${ST.show?(t===a?'ok':i===ST.picked?'no':''):''}" data-act="pick" data-i="${i}"><b style="margin-right:6px">${i+1}</b>${nl(t)}</button>`).join('')}</div>`;
  if(mode==='type')act=ST.show&&ST.typed!=null?`<div class="card" style="margin-bottom:12px;padding:12px 14px;border-color:${ST.correct?'var(--green)':'var(--red)'}"><b style="color:${ST.correct?'var(--green)':'var(--red)'}">${ST.correct?'정답':'오답'}</b> · 내 답: ${esc(ST.typed)}</div>`
    :ST.show?'':`<div class="row" style="flex-wrap:nowrap;margin-bottom:12px"><input id="typeIn" placeholder="정답 입력 후 Enter" autocomplete="off"><button class="btn pri" data-act="checkType">확인</button></div>`;

    :mode==='type'?`<button class="btn ghost" data-act="reveal" style="width:100%">모르겠어요 · 정답 보기</button>`:`<button class="btn ${mode==='flash'?'pri':''}" data-act="reveal" style="width:100%;padding:13px">${mode==='quiz'?'모르겠어요 · 정답 보기':'정답 보기'}</button>`;
  M(`<div class="head"><div class="row" style="flex-wrap:nowrap"><a class="icon-btn" href="${back}">${ic(I.back)}</a><div><h1>${title}</h1><div class="sub">${ST.done}장 완료 · 남은 ${left}장</div></div></div>
  <div class="row" style="gap:6px">${[['flash','플래시'],['quiz','객관식'],['type','입력']].map(([k,l])=>`<button class="toggle ${ST.mode===k?'on':''}" data-act="mode" data-v="${k}">${l}</button>`).join('')}</div></div>

  <div class="card flash" id="flash" ${mode==='flash'&&!ST.show?'data-act="reveal"':''}>

  </div>
  ${act}
  <div class="kbd hide-m" style="text-align:center;margin-top:14px">Space 정답 보기 · 1~4 평가 · H 힌트 · S 듣기 · 모바일: 좌우 스와이프로 평가</div>`);
  if(isDesktop())$('#typeIn')?.focus();
}
function grade(g){
  if(!ST||!ST.show)return;
  const id=ST.q[ST.i],idx=S.cards.findIndex(c=>c.id===id);
  if(idx>-1){
    const isNew=!S.cards[idx].last;
    S.cards[idx]=nextState(S.cards[idx],g);logReview(g>1,isNew);save();
    navigator.vibrate?.(g===1?[30,40,30]:15);
    if(g===1)ST.q.splice(Math.min(ST.q.length,ST.i+4),0,id); // 틀린 카드는 몇 장 뒤에 다시
  }
  ST.done++;ST.i++;resetCardState();drawStudy();
}
function pick(i){
  if(!ST||ST.show||!ST.choices)return;
  ST.picked=i;ST.show=true;ST.correct=ST.choices[i]===ansText(curCard());
  navigator.vibrate?.(ST.correct?15:[30,40,30]);drawStudy();
}
function checkType(){
  const el=$('#typeIn');if(!ST||ST.show||!el)return;
  const v=el.value.trim();if(!v)return toast('답을 입력하세요');
  const norm=s=>String(s).toLowerCase().replace(/[\s.,!?'"()\-·~]/g,''),ans=ansText(curCard());
  ST.typed=v;ST.correct=norm(ans)===norm(v)||ans.split(/[,/;\n]/).map(norm).filter(Boolean).includes(norm(v));
  ST.show=true;drawStudy();
}

function csvRow(l){
  const o=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','){o.push(cur.trim());cur=''}else cur+=ch}
  o.push(cur.trim());return o;
}
function parseImport(t){
  const lines=String(t).replace(/^\ufeff/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return [];
  const sep=lines[0].includes('\t')?'\t':lines[0].includes('|')?'|':',';
  const rows=lines.map(l=>sep===','?csvRow(l):l.split(sep).map(x=>x.trim()));
  if(/^(front|앞면|question|질문)$/i.test(rows[0][0]))rows.shift();
  return rows.filter(r=>r[0]).map(([f,b='',h=''])=>({front:f,back:b,hint:h,type:/\{\{.+?\}\}/.test(f)?'cloze':'basic'}));
}
function doImport(){
  const rows=parseImport($('#imText').value);if(!rows.length)return toast('가져올 내용이 없습니다');
  let dk=$('#imDeck').value;
  if(dk==='__new'){const d={id:uid(),name:'가져온 카드 '+dayKey(),created:Date.now()};S.decks.push(d);dk=d.id}
  rows.forEach(r=>S.cards.push(newCard(dk,r.front,r.back,r.hint,r.type)));
  save();closeModal();toast(rows.length+'장을 가져왔어요');go('#deck/'+dk);
}

function syncGen(){
  const g=id=>document.getElementById(id);if(!g('gSrc'))return;
  GEN.src=g('gSrc').value;GEN.count=Math.min(100,Math.max(1,parseInt(g('gCount').value)||15));
  GEN.type=g('gType').value;GEN.deck=g('gDeck').value;GEN.web=g('gWeb').checked;
}
async function doGen(){
  if(GEN.busy)return;
  syncGen();
  const src=GEN.src.trim();if(!src)return toast('주제나 자료를 입력하세요');
  const n=GEN.count;
  Object.assign(GEN,{busy:true,items:[]});vGen();
  try{
    let ctx='';
    if(GEN.web){try{ctx=fmtResults(await webSearch(src.slice(0,100)))}catch(e){toast('검색 실패: '+e.message)}}
    const rule={basic:'모두 basic으로',cloze:'모두 cloze로',vocab:'모두 vocab으로',mixed:'basic, cloze, vocab을 내용에 맞게 섞어서'}[GEN.type];
    const sys='너는 암기 카드 제작 전문가다. 반드시 JSON 배열만 출력한다. 설명과 코드블록은 쓰지 않는다.\n형식: [{"type":"basic|cloze|vocab","front":"...","back":"...","hint":"..."}]\n규칙: basic은 front에 질문, back에 간결한 답. cloze는 front 문장 속 핵심어를 {{정답}}으로 감싸고 back은 빈 문자열이나 보충 설명. vocab은 front에 단어, back에 뜻, hint에 예문. 카드 하나에는 개념 하나만(최소 정보 원칙). 확실한 사실만 쓴다.';
    const {text}=await callLLM([{role:'system',content:sys},{role:'user',content:`${src}\n\n위 내용으로 카드 ${n}장을 ${rule} 만들어라.${ctx?'\n\n참고 자료:\n'+ctx:''}`}]);
    const j=safeJSON(text),list=Array.isArray(j)?j:findArr(j);
    if(!list)throw new Error('AI 응답에서 카드를 찾지 못했습니다. 다시 시도하세요');
    GEN.items=list.filter(x=>x&&x.front).slice(0,n).map(x=>{
      let type=['basic','cloze','vocab'].includes(x.type)?x.type:'basic';
      if(type==='cloze'&&!/\{\{.+?\}\}/.test(x.front))type='basic';
      return {type,front:String(x.front),back:String(x.back??''),hint:String(x.hint??''),on:true};
    });
    toast(GEN.items.length+'장 생성됨');
  }catch(e){toast(e.message,4000)}
  GEN.busy=false;if(curRoute()[0]==='gen')vGen();
}
function genSave(){
  syncGen();
  const items=GEN.items.filter(x=>x.on);if(!items.length)return toast('저장할 카드를 선택하세요');
  let dk=GEN.deck;
  if(dk==='__new'||!S.decks.some(d=>d.id===dk)){const d={id:uid(),name:GEN.src.trim().split('\n')[0].slice(0,24)||'AI 카드',created:Date.now()};S.decks.push(d);dk=d.id}
  items.forEach(x=>S.cards.push(newCard(dk,x.front,x.back,x.hint,x.type)));
  save();GEN.items=[];GEN.deck=dk;toast(items.length+'장 저장됨');go('#deck/'+dk);
}

function drawMsgs(){
  const box=$('#msgs');if(!box)return;
  const sb=document.querySelector('[data-act="send"]');if(sb)sb.disabled=TUTOR.busy;
  box.innerHTML=(TUTOR.msgs.length?'':`<div class="empty"><div class="bigic" style="background:var(--accent-soft);color:var(--accent)">${ic(I.chat)}</div>궁금한 것을 물어보거나 아래 버튼으로 시작하세요</div>`)

      ${m.err?'':`<div class="row" style="margin-top:6px;gap:4px"><button class="btn sm ghost" data-act="toCards" data-i="${i}">${ic(I.plus)}카드로 만들기</button><button class="btn sm ghost" data-act="speakMsg" data-i="${i}">${ic(I.volume)}</button></div>`}</div>`).join('')

async function tutorSend(given){
  const el=$('#tIn');
  const text=String(given??el?.value??'').trim();if(!text||TUTOR.busy)return;
  if(el&&given==null){el.value='';el.style.height=''}
  const mark=TUTOR.hist.length;
  TUTOR.msgs.push({role:'u',text});TUTOR.busy=true;drawMsgs();
  try{
    let content=text,src=null;
    if(TUTOR.web){
      try{const r=await webSearch(text.slice(0,200));if(r.length){src=r;content+=`\n\n[웹 검색 결과]\n${fmtResults(r)}\n위 자료를 참고하고, 인용한 부분에는 [번호]를 붙여라.`}}
      catch(e){TUTOR.msgs.push({role:'t',text:'검색 실패: '+e.message});drawMsgs()}
    }
    TUTOR.hist.push({role:'user',content});
    const tools=TUTOR.mcp?mcpToolDefs():null;let out='';
    for(let step=0;step<6;step++){
      let s=Math.max(0,TUTOR.hist.length-30);while(s>0&&TUTOR.hist[s].role!=='user')s--; // 도구 메시지 중간에서 자르지 않음
      const r=await callLLM([{role:'system',content:TUTOR_SYS},...TUTOR.hist.slice(s)],{tools});
      if(!r.calls?.length){out=r.text;break}
      TUTOR.hist.push({role:'assistant',content:r.text||null,tool_calls:r.calls});
      for(const c of r.calls){
        TUTOR.msgs.push({role:'t',text:'도구 실행: '+(MCP_MAP[c.function.name]?.name||c.function.name)});drawMsgs();
        let res;try{res=await mcpCall(c.function.name,safeJSON(c.function.arguments)||{})}catch(e){res='오류: '+e.message}
        TUTOR.hist.push({role:'tool',tool_call_id:c.id,content:String(res).slice(0,8000)});
      }
    }
    out=out||'(응답이 비어 있습니다)';
    TUTOR.hist.push({role:'assistant',content:out});TUTOR.msgs.push({role:'a',text:out,src});
  }catch(e){TUTOR.hist.length=mark;TUTOR.msgs.push({role:'a',text:'오류: '+e.message,err:true})}
  TUTOR.busy=false;drawMsgs();
}

    S.decks=S.decks.filter(x=>x.id!==id);S.cards=S.cards.filter(c=>c.deck!==id);save();toast('삭제됨');go('#home');
  },
  openDeck:({id})=>go('#deck/'+id),
  addCard:({id})=>cardModal(null,id),
  editCard:({id})=>cardModal(id),
  editCur:()=>{const c=curCard();if(c)cardModal(c.id)},
  saveCard:({id})=>saveCard(id),
  delCard:({id})=>{if(!confirm('이 카드를 삭제할까요?'))return;S.cards=S.cards.filter(c=>c.id!==id);save();rerender()},
  import:({id})=>importModal(id),
  doImport:()=>doImport(),
  exportDeck:({id})=>{
    const d=S.decks.find(x=>x.id===id);if(!d)return;
    const rows=[['앞면','뒷면','힌트'],...S.cards.filter(c=>c.deck===id).map(c=>[c.front,c.back,c.hint])];
    download(d.name.replace(/[\\/:*?"<>|]/g,'_')+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  },
  reveal:()=>{if(ST&&!ST.show){ST.show=true;drawStudy()}},
  pick:({i})=>pick(+i),
  grade:({g})=>grade(+g),
  checkType:()=>checkType(),
  mode:({v})=>{if(!ST)return;ST.mode=v;S.settings.mode=v;save();resetCardState();drawStudy()},
  hint:()=>{if(ST&&curCard()?.hint){ST.hint=!ST.hint;drawStudy()}},
  speak:()=>{
    const c=curCard();if(!c)return;
    if(c.type==='cloze')speak(ST.show?String(c.front).replace(/\{\{(.+?)\}\}/g,'$1'):String(c.front).replace(/\{\{.+?\}\}/g,'빈칸'));
    else speak(ST.show?ansText(c):c.front);
  },
  mnemonic:()=>mnemonic(),
  saveMn:({id})=>{
    const c=S.cards.find(x=>x.id===id);if(!c||!MN)return;
    c.hint=MN.replace(/\*\*/g,'').trim().slice(0,600);save();closeModal();toast('힌트로 저장했어요');rerender();
  },
  gen:()=>doGen(),
  genAll:()=>{syncGen();const all=GEN.items.every(x=>x.on);GEN.items.forEach(x=>x.on=!all);vGen()},
  genSave:()=>genSave(),
  tWeb:(d,el)=>{TUTOR.web=!TUTOR.web;el.classList.toggle('on',TUTOR.web)},
  tMcp:async(d,el)=>{
    if(!TUTOR.mcp&&!S.settings.mcp.length)return toast('설정에서 MCP 서버를 먼저 추가하세요');
    TUTOR.mcp=!TUTOR.mcp;el.classList.toggle('on',TUTOR.mcp);
    if(!TUTOR.mcp)return;
    for(const s of S.settings.mcp.filter(s=>!MCP[s.id]?.tools)){try{await mcpConnect(s)}catch(e){toast(s.name+': '+e.message,4000)}}
    const total=S.settings.mcp.reduce((n,s)=>n+(MCP[s.id]?.tools?.length||0),0);
    toast(total?`MCP 도구 ${total}개 사용 가능`:'사용 가능한 MCP 도구가 없습니다');
  },
  clearChat:()=>{if(TUTOR.busy)return;TUTOR.msgs=[];TUTOR.hist=[];drawMsgs()},
  quick:({i})=>{const t=$('#tIn');if(!t)return;t.value=QUICK[+i][1];t.focus();t.setSelectionRange(t.value.length,t.value.length)},
  send:()=>tutorSend(),
  weakAsk:()=>weakAsk(),
  toCards:({i})=>{const m=TUTOR.msgs[+i];if(!m)return;Object.assign(GEN,{src:m.text,items:[]});toast('내용을 넣었어요. 카드 생성하기를 누르세요');go('#gen')},
  speakMsg:({i})=>{const m=TUTOR.msgs[+i];if(m)speak(plainText(md(m.text)))},
  testAI:async(d,el)=>{
    el.disabled=true;
    try{const {text}=await callLLM([{role:'user',content:'연결 테스트입니다. "OK"라고만 답하세요.'}],{max:256});toast('연결 성공: '+((text||'(빈 응답)').trim().slice(0,60)),4000)}
    catch(e){toast(e.message,5000)}finally{el.disabled=false}
  },
  testSearch:async(d,el)=>{
    el.disabled=true;
    try{const r=await webSearch('기억력');toast(r.length?`결과 ${r.length}개 · ${r[0].title}`:'결과가 없습니다',4000)}
    catch(e){toast(e.message,5000)}finally{el.disabled=false}
  },
  mcpAdd:async()=>{
    const name=$('#mName').value.trim(),url=$('#mUrl').value.trim(),token=$('#mTok').value.trim();
    if(!/^https?:\/\//i.test(url))return toast('http:// 또는 https://로 시작하는 주소를 입력하세요');
    let host;try{host=new URL(url).host}catch{return toast('주소 형식이 올바르지 않습니다')}
    const s={id:uid(),name:name||host,url,token};S.settings.mcp.push(s);save();vSettings();
    try{const n=await mcpConnect(s);toast(`연결됨 · 도구 ${n}개`)}catch(e){toast(e.message,5000)}
    if(curRoute()[0]==='settings')vSettings();
  },
  mcpConn:async({id},el)=>{
    const s=S.settings.mcp.find(x=>x.id===id);if(!s)return;
    el.disabled=true;
    try{const n=await mcpConnect(s);toast(`연결됨 · 도구 ${n}개`)}catch(e){toast(e.message,5000)}
    if(curRoute()[0]==='settings')vSettings();
  },
  mcpDel:({id})=>{if(!confirm('이 MCP 서버를 삭제할까요?'))return;S.settings.mcp=S.settings.mcp.filter(x=>x.id!==id);delete MCP[id];save();vSettings()},
  exportAll:()=>download(`memoryall-backup-${dayKey()}.json`,JSON.stringify(S,null,2)),
  resetAll:()=>{
    if(!confirm('모든 덱, 카드, 기록, 설정을 삭제할까요? 되돌릴 수 없습니다.'))return;
    localStorage.removeItem(KEY);load();GEN=GEN0();TUTOR=TUTOR0();
    toast('초기화했어요');go('#home');
  }
};

// 클릭
document.addEventListener('click',async e=>{
  if(e.target.id==='modalBg')return closeModal();
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='BUTTON')e.preventDefault();
  try{await fn(el.dataset,el)}catch(err){console.error(err);toast(err.message||'오류가 발생했습니다',4000)}
});

// 입력 (실시간 반영)
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='deckQ'){DQ=t.value;drawCardList(t.dataset.deck);return}
  if(t.id==='tIn'){t.style.height='auto';t.style.height=Math.min(160,t.scrollHeight)+'px';return}
  if(t.dataset.set&&t.tagName!=='SELECT')setPath(t.dataset.set,t.value);
});

// 변경 (선택 상자, 체크박스, 파일)
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.set){setPath(t.dataset.set,t.value);if(t.hasAttribute('data-rerender'))vSettings();return}
  if(t.dataset.gi!=null){const x=GEN.items[+t.dataset.gi];if(x)x.on=t.checked;syncGen();vGen();return}
  if(t.id==='gWeb'){GEN.web=t.checked;t.closest('.toggle')?.classList.toggle('on',t.checked);return}
  if(t.id==='imFile'){
    const f=t.files[0];if(!f)return;
    try{$('#imText').value=await f.text();toast('파일 내용을 불러왔어요. 가져오기를 누르세요')}catch{toast('파일을 읽을 수 없습니다')}
    return;
  }
  if(t.id==='bkFile'){
    const f=t.files[0];t.value='';if(!f)return;
    const d=safeJSON(await f.text().catch(()=>''));
    if(!d||!Array.isArray(d.decks)||!Array.isArray(d.cards))return toast('올바른 MemoryAll 백업 파일이 아닙니다');
    if(!confirm(`덱 ${d.decks.length}개, 카드 ${d.cards.length}장으로 현재 데이터를 덮어쓸까요?`))return;
    try{localStorage.setItem(KEY,JSON.stringify(d))}catch{return toast('저장 공간이 부족합니다')}
    load();save();GEN=GEN0();TUTOR=TUTOR0();toast('복원 완료');go('#home');
  }
});

// 키보드 단축키
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return; // 한글 조합 중 무시
  const t=e.target,tag=t.tagName;
  if($('#modalBg').classList.contains('show')){
    if(e.key==='Escape')closeModal();
    else if(e.key==='Enter'&&t.id==='dName'){e.preventDefault();saveDeck($('[data-act="saveDeck"]').dataset.id)}
    else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&$('[data-act="saveCard"]')){e.preventDefault();saveCard($('[data-act="saveCard"]').dataset.id)}
    return;
  }
  if(t.id==='typeIn'&&e.key==='Enter'){e.preventDefault();checkType();return}
  if(t.id==='tIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();tutorSend();return}
  if(/INPUT|TEXTAREA|SELECT/.test(tag)||e.ctrlKey||e.metaKey||e.altKey||!ST||!curCard())return;
  if(tag==='BUTTON'&&(e.key===' '||e.key==='Enter'))return; // 버튼 기본 클릭과 중복 방지
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!ST.show)ACT.reveal();return}
  const n=+e.key;
  if(n>=1&&n<=4){
    if(ST.show)grade(n);
    else if(ST.mode==='quiz'&&ST.choices&&n<=ST.choices.length)pick(n-1);
    return;
  }
  if(e.code==='KeyH')ACT.hint();
  else if(e.code==='KeyS')ACT.speak();
});

// 모바일 스와이프 평가 (정답 확인 후: 오른쪽 = 좋음, 왼쪽 = 다시)
let tx=null,ty=0;
document.addEventListener('touchstart',e=>{
  if(!e.target.closest('#flash')||!ST?.show){tx=null;return}
  tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(tx==null)return;const dx=e.touches[0].clientX-tx,f=$('#flash');
  if(f&&Math.abs(dx)>10)f.style.transform=`translateX(${dx*.4}px) rotate(${dx*.02}deg)`;
},{passive:true});
function swipeEnd(e){
  if(tx==null)return;
  const p=e.changedTouches[0],dx=p.clientX-tx,dy=p.clientY-ty,f=$('#flash');tx=null;
  if(f)f.style.transform='';
  if(e.type==='touchend'&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)grade(dx>0?3:1);
}
document.addEventListener('touchend',swipeEnd,{passive:true});
document.addEventListener('touchcancel',swipeEnd,{passive:true});

/* ================= 9. 앱 설치 · 시작 ================= */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refreshInstall()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('앱이 설치됐어요')});
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PM.run)pmTick()});

// 예전 sw.js 서비스워커·캐시 정리 (옛 화면이 남는 버그 방지)
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
if(window.caches)caches.keys().then(ks=>ks.forEach(k=>{if(k.startsWith('memoryall'))caches.delete(k)})).catch(()=>{});

load();
$('#topSet').innerHTML=ic(I.gear);
pmDraw();
route();
</script>
