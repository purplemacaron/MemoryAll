<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MemoryAll">
<title>MemoryAll</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="manifest" id="manifestLink">
<script>
/* 앱 아이콘·매니페스트를 파일 없이 코드로 생성 (단일 파일 구조) */
(function(){
  try{ // 캔버스 미지원/실패 환경에서도 앱 전체가 죽지 않도록 격리
  function makeIcon(size){
    const c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext&&c.getContext('2d');if(!x)throw new Error('no canvas ctx');
    const r=size*0.22,g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#6366f1');g.addColorStop(1,'#8b5cf6');
    x.fillStyle=g;x.beginPath();x.moveTo(r,0);
    x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);
    x.closePath();x.fill();
    x.fillStyle='#fff';x.font='700 '+(size*0.53)+'px Arial,sans-serif';
    x.textAlign='center';x.textBaseline='middle';x.fillText('M',size/2,size*0.54);
    return c.toDataURL('image/png');
  }
  const i192=makeIcon(192),i512=makeIcon(512);
  document.getElementById('favicon').href=i192;
  document.getElementById('appleIcon').href=makeIcon(180);
  const base=location.href.split('#')[0].split('?')[0];
  const mf={name:'MemoryAll',short_name:'MemoryAll',start_url:base,scope:new URL('./',base).href,display:'standalone',
    background_color:'#f6f7f9',theme_color:'#ffffff',
    icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
  document.getElementById('manifestLink').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));
  }catch(e){/* 아이콘 생성 실패 시에도 앱은 정상 동작 */}
})();
// jsdom 등 캔버스 미지원 환경의 스크립트 실행을 막지 않도록, window에 테스트/진단용 훅 노출
</script>
<style>
/* 1. 디자인 토큰 */
:root{--bg:#f6f7f9;--panel:#fff;--line:#e7e9ee;--text:#16181d;--sub:#6b7280;--accent:#4f46e5;--accent-soft:#eef2ff;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--amber:#f59e0b;--r:14px;--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
body.dark{--bg:#0f1218;--panel:#171a21;--line:#262b36;--text:#e7eaf0;--sub:#9aa3b2;--accent:#818cf8;--accent-soft:#232a45;--sh:0 1px 2px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.4)}
body.dark code{background:#232834}
body.dark .heat i{background:#232834}
body.dark .heat i.l1{background:#374151}.heat i.l2,body.dark .heat i.l2{background:#4f5b93}
body.dark .tagchip:hover{border-color:#3a4152}
body.dark .selbar{border-color:#3a4152}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex-shrink:0}
code{background:#f3f4f6;padding:1px 5px;border-radius:5px;font-size:12.5px}
a{color:inherit}

/* 2. 레이아웃 */
.app{display:flex;min-height:100vh}
.side{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:block;padding:0 8px 18px;font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--text);user-select:text;-webkit-user-select:text;cursor:text}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--sub);text-decoration:none;font-weight:500}
.nav:hover{background:var(--bg);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grow{flex:1}
.pm{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:8px}
.pm .t{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}
.pm .m{font-size:12px;color:var(--sub)}
main{flex:1;min-width:0;padding:32px 36px 60px;max-width:1080px}
.topbar,.tabbar{display:none}

/* 3. 공통 컴포넌트 */
h1{font-size:24px;font-weight:750;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sub{color:var(--sub);font-size:13.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--sub);text-decoration:none;flex-shrink:0}
.icon-btn:hover{color:var(--text);background:var(--bg)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field{margin-bottom:14px}
.chk{width:auto;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.stat .n{font-size:26px;font-weight:750}
.stat .l{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.deck{cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.deck:hover{border-color:#c7cbf5}
.deck .name{font-weight:700;font-size:15.5px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--sub);font-weight:600;white-space:nowrap}
.pill.b{background:#eff6ff;color:var(--blue)}.pill.g{background:#ecfdf5;color:var(--green)}.pill.r{background:#fef2f2;color:var(--red)}.pill.a{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.bigic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.bigic svg{width:26px;height:26px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);font-weight:600;cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);user-select:none;margin:0}
.toggle.on{color:var(--accent);border-color:#c7cbf5;background:var(--accent-soft)}
.toggle svg{width:15px;height:15px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item .f{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .b{color:var(--sub);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* 4. 학습 화면 */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px 24px;font-size:22px;font-weight:600;user-select:none;touch-action:pan-y;transition:transform .2s}
.flash[data-act]{cursor:pointer}
.flash .ans{margin-top:22px;padding-top:22px;border-top:1px dashed var(--line);width:100%;font-size:18px;font-weight:500;color:#374151}
.flash .hint{margin-top:14px;font-size:14px;color:var(--amber);font-weight:500;display:flex;align-items:center;gap:6px}
.cloze{color:var(--accent);background:var(--accent-soft);padding:0 6px;border-radius:6px}
.gradebar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gradebar .btn{flex-direction:column;gap:2px;padding:10px}
.gradebar small{font-weight:500;font-size:12px;opacity:.75}
.gr1{color:var(--red)!important}.gr2{color:var(--amber)!important}.gr3{color:var(--green)!important}.gr4{color:var(--blue)!important}
.choice{text-align:left;justify-content:flex-start;white-space:normal;font-weight:500;padding:12px 14px;width:100%}
.choice.ok{border-color:var(--green);background:#ecfdf5}
.choice.no{border-color:var(--red);background:#fef2f2}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.kbd{font-size:12px;color:var(--sub)}

/* 5. 튜터 채팅 */
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;line-height:1.6;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.t{align-self:flex-start;font-size:12.5px;color:var(--sub);background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.msg pre{background:#f3f4f6;padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;font-size:13px}
.msg pre code{background:none;padding:0}
.msg ul,.msg ol{padding-left:20px;margin:4px 0}
.msg p{margin:4px 0}
.msg a{color:var(--accent)}
.src{font-size:12.5px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.src a{color:var(--accent);text-decoration:none}
.composer{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px}
.composer textarea{border:0;box-shadow:none;min-height:24px;max-height:160px;padding:8px;resize:none}

/* 6. 통계 */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:#eef0f4}
.heat i.l1{background:#c7d2fe}.heat i.l2{background:#818cf8}.heat i.l3{background:#6366f1}.heat i.l4{background:#4338ca}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-grid u{text-align:center;font-size:11px;color:var(--sub);font-weight:700;text-decoration:none;padding:2px 0}
.cal-grid>div{min-height:52px;border-radius:9px;background:var(--bg);border:1px solid transparent;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between}
.cal-grid>div b{font-size:12.5px;font-weight:600}
.cal-grid>div span{display:flex;justify-content:flex-end;align-items:flex-end;min-height:18px}
.cal-grid>div svg{width:15px;height:15px;color:var(--green)}
.cal-done{background:var(--accent-soft)!important}
.cal-today{border-color:var(--accent)!important}
.cal-fut{font-style:normal;font-size:10.5px;font-weight:700;color:var(--blue);background:rgba(59,130,246,.12);border-radius:99px;padding:1px 6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars b{width:100%;max-width:36px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars span{font-size:11.5px;color:var(--sub)}
.bars em{font-style:normal;font-size:11.5px;font-weight:600}

/* 7. 모달·토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.15)}
.modal h2{justify-content:space-between}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 7b. 확장 기능 스타일 (기존 토큰 재사용) */
.tagchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--sub);font-weight:600;white-space:nowrap;cursor:pointer;border:1px solid var(--line)}
.tagchip:hover{border-color:#c7cbf5;color:var(--text)}
.tagchip.on{background:var(--accent-soft);color:var(--accent);border-color:#c7cbf5}
.tl{position:relative;padding-left:18px;display:flex;flex-direction:column;gap:12px}
.tl:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .ev{position:relative}
.tl .ev:before{content:'';position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.tl .ev.mile:before{background:var(--green)}
.tl .ev.warn:before{background:var(--amber)}
.tl .d{font-weight:700;font-size:13.5px}
.tl .s{color:var(--sub);font-size:13px}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 0 2px}
.mini{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--sub);text-decoration:none}
.mini:hover{color:var(--text);background:var(--bg)}
.mini b{color:var(--accent);font-variant-numeric:tabular-nums}
.mini svg{width:15px;height:15px}
.deck.dragover{border-color:var(--accent);background:var(--accent-soft)}
.dropzone{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--sub);font-size:13px;transition:.15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--accent-soft);border:1px solid #c7cbf5;border-radius:12px;margin-bottom:10px;font-size:13.5px;font-weight:600;color:var(--accent)}

/* 8. 모바일 */
@media(max-width:820px){
  .side{display:none}
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .topbar .logo{padding:0;font-size:18px}
  main{padding:18px 16px calc(90px + env(safe-area-inset-bottom))}
  h1{font-size:21px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);text-decoration:none;padding:4px 0;font-weight:600}
  .tabbar a.on{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .two{grid-template-columns:1fr}
  .flash{min-height:260px;font-size:20px;padding:28px 18px}
  .chat{height:calc(100vh - 240px)}
  .msg{max-width:90%}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:88vh;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">MemoryAll</div>
    <nav id="sideNav"></nav>
    <div class="grow"></div>
    <div class="pm">
      <div class="grow"><div class="m" id="pmMode">집중</div><div class="t" id="pmTime">25:00</div></div>
      <button class="icon-btn" data-act="pmToggle" id="pmToggle" title="시작/일시정지"></button>
      <button class="icon-btn" data-act="pmReset" id="pmReset" title="초기화"></button>
    </div>
  </aside>
  <header class="topbar">
    <div class="logo">MemoryAll</div>
    <div class="row" style="gap:8px"><button class="btn sm" data-act="pmToggle" id="pmMini"></button><a class="icon-btn" href="#settings" id="topSet" title="설정"></a></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 1. 유틸리티 ================= */
const $=s=>document.querySelector(s);
const DAY=864e5;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const safeUrl=u=>{const s=String(u||'').trim();if(/^https?:\/\//i.test(s))return s;if(/^[a-z][a-z0-9+.-]*:/i.test(s))return '#';return 'https://'+s.replace(/^\/+/,'')};
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isDesktop=()=>window.matchMedia?matchMedia('(min-width:821px)').matches:true;
const fmtNum=n=>Number(n||0).toLocaleString('ko-KR');
const fmtDur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+'시간 ':'')+(m||(!h?s+'초':''))+(h||m?'분':'')};
// 시간대 문자열 파싱 ("19:30" → 분) — 실패 시 null
const parseHM=s=>{const m=/^(\d{1,2})\s*[:.시]\s*(\d{1,2})?$/.exec(String(s||'').trim());if(!m)return null;const h=+m[1],mi=+(m[2]||0);return h>23||mi>59?null:h*60+mi};

// AI 응답에서 JSON 추출 (코드블록·앞뒤 잡담 대응)
function safeJSON(t){
  t=String(t??'');
  try{return JSON.parse(t)}catch{}
  const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1])}catch{}}
  const a=t.indexOf('['),b=t.lastIndexOf(']');if(a>-1&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch{}}
  const c=t.indexOf('{'),d=t.lastIndexOf('}');if(c>-1&&d>c){try{return JSON.parse(t.slice(c,d+1))}catch{}}
  return null;
}
// 객체 안의 첫 번째 객체 배열 찾기
function findArr(o,d=0){
  if(Array.isArray(o)&&o.some(x=>x&&typeof x==='object'))return o;
  if(o&&typeof o==='object'&&d<4)for(const v of Object.values(o)){const r=findArr(v,d+1);if(r)return r}
  return null;
}
function plainText(x){const t=document.createElement('textarea');t.innerHTML=String(x||'').replace(/<[^>]+>/g,' ');return t.value.replace(/\s+/g,' ').trim()}

// 안전한 스킴만 통과 (javascript:, data:, file: 등 차단) → md()와 소스 링크에서 사용
// 개행·공백·컨트롤문자로 위장한 'java\nscript:' 같은 변형도 원문 단계에서 걸러냄
const linkUrl=u=>{const raw=String(u??'').replace(/[\u0000-\u0020\u007f]/g,'');if(/^javascript|^data|^vbscript|^file|^blob/i.test(raw))return '#';const s=safeUrl(u);return /^https?:\/\//i.test(s)?s:'#'};

// 간단한 마크다운 (먼저 전부 escape → XSS 방지)
function md(src){
  const blocks=[];
  let s=esc(src).replace(/```\w*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre><code>'+c+'</code></pre>');return '\n\u0000'+(blocks.length-1)+'\u0000\n'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     // URL은 &amp; 등 escape된 문자도 허용하고, 마지막 / 뒤의 마크다운 기호(구두점)는 링크에서 제외
     .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>{const tr=u.match(/[.,!?;:)\]}]+$/),cut=tr?tr[0].length:0;
       return `<a href="${linkUrl(u.slice(0,u.length-cut))}" target="_blank" rel="noopener noreferrer">${t}</a>${cut?u.slice(u.length-cut):''}`})
     .replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<]+[^\s<.,!?;:)\]])/g,(m,p,u)=>p+`<a href="${linkUrl(u)}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  const out=[];let list=null;
  for(const line of s.split('\n')){
    if(/^\u0000\d+\u0000$/.test(line)){if(list){out.push('</'+list+'>');list=null}out.push(line);continue}
    const ul=line.match(/^\s*[-*]\s+(.*)/),ol=line.match(/^\s*\d+[.)]\s+(.*)/),h=line.match(/^#{1,4}\s+(.*)/);
    const type=ul?'ul':ol?'ol':null;
    if(list&&list!==type){out.push('</'+list+'>');list=null}
    if(type){if(!list){out.push('<'+type+'>');list=type}out.push('<li>'+(ul||ol)[1]+'</li>')}
    else if(h)out.push('<p><b>'+h[1]+'</b></p>');
    else if(line.trim())out.push('<p>'+line+'</p>');
  }
  if(list)out.push('</'+list+'>');
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

let toastT;
function toast(m,ms=2600){LAST_TOAST=m;const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms)}

function download(name,text,type='application/json'){
  // URL.createObjectURL 미지원 환경(jsdom·구버전 브라우저)에서도 오류 없이 동작
  let url=null;
  try{if(typeof URL!=='undefined'&&URL.createObjectURL)url=URL.createObjectURL(new Blob([text],{type}))}catch{}
  if(!url){ // data URL 폴백(UTF-8 인코딩)
    url='data:'+type+';charset=utf-8,'+encodeURIComponent(text);
  }
  const a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{try{if(url.startsWith('blob:')&&URL.revokeObjectURL)URL.revokeObjectURL(url)}catch{}},1000);
}
// fetch + 타임아웃 + 알기 쉬운 오류
async function fetchJ(url,opt={},ms=60000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);let r,txt;
  try{r=await fetch(url,{...opt,signal:ctl.signal});txt=await r.text()}
  catch(e){throw new Error(e.name==='AbortError'?'요청 시간이 초과됐습니다':'연결 실패: 주소, CORS 설정, 네트워크를 확인하세요')}
  finally{clearTimeout(t)}
  if(!r.ok)throw new Error('HTTP '+r.status+': '+txt.slice(0,200));
  try{return JSON.parse(txt)}catch{throw new Error('JSON 응답이 아닙니다')}
}

/* ================= 3. 데이터 저장소 (localStorage 'memoryall') ================= */
const KEY='memoryall';
let delTomb={};
const DEF_SETTINGS={newPerDay:20,ttsLang:'auto',mode:'flash',pmNotify:false,pmWork:25,pmBreak:5,
  ai:{provider:'openai',base:'https://api.openai.com/v1',model:'gpt-4o-mini',key:''},
  search:{provider:'wikipedia',key:'',url:'',lang:'ko'},mcp:[],
  theme:'auto',goal:30,dailyNotified:'',reversed:false};
let S;

function newCard(deck,front,back='',hint='',type='basic',tags){
  const now=Date.now();
  return {id:uid(),deck,type,front,back,hint,tags:Array.isArray(tags)?tags.map(String).slice(0,12):[],star:false,created:now,due:now,iv:0,ef:2.5,reps:0,lapses:0,last:0};
}
function seed(){
  const d1={id:uid(),name:'시작하기',created:Date.now()},d2={id:uid(),name:'영단어 기초',created:Date.now()};
  S.decks.push(d1,d2);
  S.cards.push(
    newCard(d1.id,'간격 반복(Spaced Repetition)이란?','잊어버릴 즈음에 복습 간격을 점점 늘려 가며 반복하는 학습법','망각 곡선'),
    newCard(d1.id,'능동적 회상(Active Recall)이란?','답을 보기 전에 스스로 먼저 떠올려 보는 학습법','보기 전에 먼저'),
    newCard(d1.id,'{{에빙하우스}}는 망각 곡선을 처음 연구한 심리학자다.','','','cloze'),
    newCard(d1.id,'기억의 궁전 기법은 익숙한 {{장소}}에 정보를 배치해 기억하는 방법이다.','','','cloze'),
    newCard(d2.id,'ephemeral','순간적인, 덧없는','Fame is ephemeral.','vocab'),
    newCard(d2.id,'meticulous','꼼꼼한, 세심한','She is meticulous about details.','vocab'),
    newCard(d2.id,'resilient','회복력 있는, 잘 회복하는','Children are remarkably resilient.','vocab')
  );
}
function load(){
  const raw=localStorage.getItem(KEY),d=raw?safeJSON(raw):null;
  const def=JSON.parse(JSON.stringify(DEF_SETTINGS));
  S={decks:[],cards:[],log:{},...(d&&typeof d==='object'?d:{})};
  delTomb=(d&&d.delTomb&&typeof d.delTomb==='object')?d.delTomb:{};
  const st=S.settings||{};
  S.settings={...def,...st,ai:{...def.ai,...(st.ai||{})},search:{...def.search,...(st.search||{})},mcp:Array.isArray(st.mcp)?st.mcp:[]};
  if(!Array.isArray(S.decks))S.decks=[];
  if(!Array.isArray(S.cards))S.cards=[];
  S.cards=S.cards.filter(c=>c&&c.id&&c.front!=null);
  // 외딴(orphan) 카드: 존재하지 않는 덱을 가리키는 카드는 전체 학습에도 나타나지 않도록 제거
  const deckIds=new Set(S.decks.map(d=>d.id));
  S.cards=S.cards.filter(c=>deckIds.has(c.deck));
  // 삭제 이력 적용: 한 번 삭제된 덱의 카드는 다시 나타나지 않는다 (백업/병합으로 되살아나는 버그 차단)
  S.cards=S.cards.filter(c=>!delTomb[c.deck]);
  if(!S.log||typeof S.log!=='object')S.log={};
  // 삭제 이력(delTomb)에 있는 덱은 메모리에서도 제거 — 다른 탭 병합·구버전 저장본이
  // 이미 삭제한 덱을 되살려 '전체 학습'에 다시 나오는 버그 차단 (tombstone 우선 원칙)
  if(Object.keys(delTomb).length){
    S.decks=S.decks.filter(d=>!delTomb[d.id]);
    const alive=new Set(S.decks.map(d=>d.id));
    S.cards=S.cards.filter(c=>alive.has(c.deck)&&!delTomb[c.deck]);
  }
  // 백업·부분 저장 데이터에서 필드 누락 시 기본값 보정 (학습 중 undefined 오류 방지)
  for(const c of S.cards){
    if(typeof c.deck!=='string')c.deck='';
    if(!TYPES[c.type])c.type='basic';
    if(c.back==null)c.back='';if(c.hint==null)c.hint='';
    if(!Array.isArray(c.tags))c.tags=[];c.tags=c.tags.map(String).slice(0,12);
    c.star=!!c.star;
    if(typeof c.due!=='number'||isNaN(c.due))c.due=c.last||Date.now();
    if(typeof c.iv!=='number')c.iv=0;if(typeof c.ef!=='number'||c.ef<1.3)c.ef=2.5;
    if(typeof c.reps!=='number')c.reps=0;if(typeof c.lapses!=='number')c.lapses=0;
    if(typeof c.created!=='number')c.created=Date.now();
  }
  if(!d){seed();save()}
  // log 항목도 형태 보정 (손상된 로그로 인한 통계 화면 오류 방지)
  for(const k in S.log){const l=S.log[k];if(!l||typeof l!=='object'){delete S.log[k];continue}
    l.n=+l.n||0;l.ok=+l.ok||0;l.nw=+l.nw||0;if(l.ok>l.n)l.ok=l.n;
    if(l.hs!=null&&!Array.isArray(l.hs))delete l.hs;}
  // 학습 기록이 전혀 없는 빈 데이터가 디스크에 남아 있으면 시드 복구 (홈·통계가 마냥 비어 보이는 문제 방지)
  if(d&&S.decks.length===0&&S.cards.length===0&&!Object.keys(S.log).length){seed();save()}
  // 덱·카드 무결성: 카드의 덱이 실존하지 않으면 새 기본 덱을 만들어 편입 (고아 카드 유실 방지)
  let orphans=S.cards.filter(c=>!S.decks.some(x=>x.id===c.deck)&&!delTomb[c.deck]);
  S.cards=S.cards.filter(c=>S.decks.some(x=>x.id===c.deck)); // 여전히 고아(삭제 이력 있음)는 유실 처리
  if(orphans.length){
    if(!S.decks.length){const g={id:uid(),name:'기본 덱',created:Date.now()};S.decks.push(g);orphans.forEach(c=>c.deck=g.id)}
    else{const d0=S.decks[0];orphans.forEach(c=>c.deck=d0.id)}
  }
  if(d||orphans.length||S.cards.length)save(); // 보정한 내용은 반드시 디스크에 반영 (새로고침 시 증발 방지)
}
function bumpVer(){try{localStorage.setItem('memoryall-ver',String(Date.now()+Math.random()))}catch{}} // 다른 탭에 변경 알림용
let LAST_GOOD=null;
function save(){
  let j;
  try{j=JSON.stringify({...S,delTomb})}catch(e){console.error('save serialize',e);return} // 직렬화 오류는 조용히 무시(데이터 보존)
  try{localStorage.setItem(KEY,j);LAST_GOOD=j;bumpVer()}
  catch(e){ // 용량 초과만 '가득 참' 안내 — 나머지 오류는 개발자 콘솔로 노출(버그 은폐 방지)
    if(e&&(e.name==='QuotaExceededError'||e.code===22||e.code===1014))toast('저장 공간이 부족합니다. 백업 후 정리하세요',4000);
    else console.error('save',e);
  }
}

/* ================= 4. 간격 반복 엔진 (SM-2 기반, 순수 함수) ================= */
const TYPES={basic:'기본',cloze:'빈칸',vocab:'단어'};
const prev=f=>String(f||'').replace(/\{\{(.+?)\}\}/g,'[$1]');
const ansText=c=>c.type==='cloze'?[...String(c.front).matchAll(/\{\{(.+?)\}\}/g)].map(m=>m[1]).join(', '):String(c.back||'');
const newLimit=()=>Math.max(0,(+S.settings.newPerDay||0)-(S.log[dayKey()]?.nw||0));

function deckCounts(id){
  const end=startOfDay()+DAY;let total=0,due=0,nw=0;
  for(const c of S.cards){if(id&&c.deck!==id)continue;total++;if(!c.last)nw++;else if(c.due<end)due++}
  return {total,due,nw};
}
function logReview(ok,isNew){const k=dayKey(),l=S.log[k]||(S.log[k]={n:0,ok:0,nw:0});l.n++;if(ok)l.ok++;if(isNew)l.nw++;(l.hs||(l.hs=[])).push(new Date().getHours())}
// 세션 기록 (오늘의 학습 이력 타임라인·목표 진행용). 최대 300개 유지로 저장소 보호
function logSession(){const k=dayKey();const ss=S.sessions&&Array.isArray(S.sessions[k])?S.sessions[k]:(S.sessions={...(S.sessions||{}),[k]:[]});ss.push({t:Date.now(),deck:S._sessDeck||null,n:S._sessN||0,ok:S._sessOk||0,dur:S._sessDur||0});if(ss.length>300)ss.splice(0,ss.length-300)}
function todaySecs(){let s=0;for(const k in (S.sessions||{}))(S.sessions[k]||[]).forEach(x=>{if(typeof x.dur==='number')s+=x.dur;else if(+x.t>=startOfDay())s+=Math.min(1800,(Date.now()-+x.t)/1000)});return s}
function goalDone(){return (S.log[dayKey()]?.n||0)>=Math.max(1,+S.settings.goal||30)}
function checkGoal(){
  const l=S.log[dayKey()];if(!l)return;
  const g=Math.max(1,+S.settings.goal||30);
  if(l.n>=g&&!l.goal){l.goal=Date.now();save();toast(`🎯 오늘 목표 ${g}장 달성!`,4000);navigator.vibrate?.([60,40,60]);beep()}
}
function streakBest(){let best=0,s=0,t=startOfDay()+DAY/2;if(!S.log[dayKey(t)])t-=DAY;while(dayKey(t)>='2000-01-01'){if(S.log[dayKey(t)]){s++;best=Math.max(best,s)}else s=0;t-=DAY}return best}
function totalStudied(){let n=0;for(const k in S.log)n+=(+S.log[k].n||0);return n}
function streak(){let s=0,t=startOfDay()+DAY/2;if(!S.log[dayKey(t)])t-=DAY;while(S.log[dayKey(t)]){s++;t-=DAY}return s}
function weakCards(n=10){return S.cards.filter(c=>c.last&&(c.lapses>0||c.ef<2.3)).sort((a,b)=>b.lapses-a.lapses||a.ef-b.ef).slice(0,n)}

// g: 1 다시, 2 어려움, 3 좋음, 4 쉬움 → 새 상태 반환 (원본 불변)
function nextState(c,g){
  let {iv=0,ef=2.5,reps=0,lapses=0}=c;const now=Date.now();
  if(g===1)return {...c,iv:0,ef:Math.max(1.3,ef-.2),reps:0,lapses:lapses+1,due:now+10*60e3,last:now};
  const q=g===2?3:g===3?4:5;
  ef=Math.max(1.3,ef+(0.1-(5-q)*(0.08+(5-q)*0.02)));
  if(reps===0)iv=g===4?4:1;
  else if(reps===1)iv=g===2?3:g===3?6:8;
  else iv=Math.max(iv+1,Math.round(iv*(g===2?1.2:g===3?ef:ef*1.3)));
  return {...c,iv,ef,reps:reps+1,lapses,due:startOfDay()+iv*DAY,last:now};
}

function filterCards(f){
  const q=(f.q||'').toLowerCase();
  return S.cards.filter(c=>{
    if(f.deck&&c.deck!==f.deck)return false;
    if(f.star&&!c.star)return false;
    if(f.tag&&!(c.tags||[]).includes(f.tag))return false;
    if(f.st==='new'&&c.last)return false;
    if(f.st==='due'&&!(c.last&&c.due<Date.now()))return false;
    if(f.st==='weak'&&!(c.lapses>0||c.ef<2.3))return false;
    if(q&&!((c.front+' '+c.back+' '+c.hint+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q)))return false;
    return true;
  });
}
function cardSort(list,sort){
  const now=Date.now();
  const cmps={created:(a,b)=>b.created-a.created,due:(a,b)=>(a.last?1:0)-(b.last?1:0)||a.due-b.due,alpha:(a,b)=>String(a.front).localeCompare(String(b.front)),lapses:(a,b)=>b.lapses-a.lapses,star:(a,b)=>(b.star?1:0)-(a.star?1:0)||b.created-a.created};
  return [...list].sort(cmps[sort]||cmps.created);
}

function buildQueue(id,filters){
  const end=startOfDay()+DAY,pool=S.cards.filter(c=>!id||c.deck===id);
  // 태그/즐겨찾기/검색 필터가 있으면 해당 범위만 학습 (새 카드 제한도 필터 내에서 적용)
  if(filters&&(filters.tag||filters.star||filters.q)){
    let sub=filterCards({...filters,deck:id||filters.deck});
    const rev=sub.filter(c=>c.last&&c.due<end).sort((a,b)=>a.due-b.due),nw=sub.filter(c=>!c.last).sort((a,b)=>a.created-b.created);
    return shuffle([...rev.map(c=>c.id),...nw.slice(0,newLimit()).map(c=>c.id)]);
  }
  const rev=pool.filter(c=>c.last&&c.due<end).sort((a,b)=>a.due-b.due).map(c=>c.id);
  const nw=pool.filter(c=>!c.last).sort((a,b)=>a.created-b.created).slice(0,newLimit());
  nw.forEach((c,i)=>rev.splice(Math.min(rev.length,i*4+3),0,c.id)); // 새 카드를 복습 사이에 섞음
  return rev;
}

const LLM_DEDUP={last:'',at:0};
async function callLLM(messages,{tools=null,max=4096}={}){
  const lastMsg=String(messages[messages.length-1]?.content??'').slice(0,200);
  if(lastMsg&&lastMsg===LLM_DEDUP.last&&Date.now()-LLM_DEDUP.at<8000)throw new Error('같은 요청이 반복되어 중단했습니다. 잠시 후 다시 시도하세요');
  LLM_DEDUP.last=lastMsg;LLM_DEDUP.at=Date.now();
  const a=S.settings.ai;
  if(!a.base||!a.model)throw new Error('설정에서 AI API 주소와 모델을 먼저 입력하세요');
  const base=a.base.trim().replace(/\/+$/,'').replace(/\/chat\/completions$/,'');
  if(a.provider==='anthropic'){
    const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n'),out=[];
    for(const m of messages){
      if(m.role==='system')continue;
      if(m.role==='tool'){
        const blk={type:'tool_result',tool_use_id:m.tool_call_id,content:String(m.content)},last=out[out.length-1];
        if(last&&last.role==='user'&&Array.isArray(last.content)&&last.content[0]?.type==='tool_result')last.content.push(blk);
        else out.push({role:'user',content:[blk]});
      }else if(m.role==='assistant'&&m.tool_calls){
        out.push({role:'assistant',content:[...(m.content?[{type:'text',text:m.content}]:[]),...m.tool_calls.map(t=>({type:'tool_use',id:t.id,name:t.function.name,input:safeJSON(t.function.arguments)||{}}))]});
      }else out.push({role:m.role,content:String(m.content??'')});
    }
    const body={model:a.model,max_tokens:max,messages:out};
    if(sys)body.system=sys;
    if(tools?.length)body.tools=tools.map(t=>({name:t.function.name,description:t.function.description,input_schema:t.function.parameters}));
    const d=await fetchJ(base+'/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)},300000);
    const bl=d.content||[];
    return {text:bl.filter(b=>b.type==='text').map(b=>b.text).join(''),calls:bl.filter(b=>b.type==='tool_use').map(b=>({id:b.id,type:'function',function:{name:b.name,arguments:JSON.stringify(b.input||{})}}))};
  }
  const h={'Content-Type':'application/json'};if(a.key)h.Authorization='Bearer '+a.key;
  const normMsgs=messages.map(m=>({...m,content:m.content??null})); // Anthropic과 달리 content:null도 허용
  const body={model:a.model,messages:normMsgs,max_tokens:max};if(tools?.length)body.tools=tools;
  const post=()=>fetchJ(base+'/chat/completions',{method:'POST',headers:h,body:JSON.stringify(body)},300000);
  let d;
  try{d=await post()}
  catch(e){ // 일부 API는 max_completion_tokens나 tools 필드를 요구/거부 → 형식 바꿔 재시도
    const msg=e.message||'';
    if(/max_completion_tokens/.test(msg)){delete body.max_tokens;body.max_completion_tokens=max;d=await post()}
    else if(/tool/i.test(msg)&&body.tools){delete body.tools;d=await post()}
    // Anthropic 엔드포인트를 OpenAI 방식으로 잘못 입력한 경우 → Messages API로 자동 전환
    else if(/\/v1\/messages|Messages API|x-api-key|anthropic-version/i.test(msg)&&!/\/messages$/i.test(base)){
      const d2=await fetchJ(base+'/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:a.model,max_tokens:max,messages:[{role:'user',content:String(messages.findLast?.(m=>m.role!=='system')?.content??'')}].filter(m=>m.content)})},300000);
      const bl=d2.content||[];
      return {text:bl.filter(b=>b.type==='text').map(b=>b.text).join(''),calls:bl.filter(b=>b.type==='tool_use').map(b=>({id:b.id,type:'function',function:{name:b.name,arguments:JSON.stringify(b.input||{})}}))};
    }
    else throw e;
  }
  const m=d.choices?.[0]?.message||{};
  return {text:m.content||'',calls:m.tool_calls||[]};
}

// MCP (Streamable HTTP, JSON-RPC 2.0)
const MCP={};let MCP_MAP={},rpcId=0;
async function mcpRPC(srv,method,params,notify=false){
  const st=MCP[srv.id]||(MCP[srv.id]={});
  const h={'Content-Type':'application/json',Accept:'application/json, text/event-stream'};
  if(st.sid)h['Mcp-Session-Id']=st.sid;
  if(srv.token)h.Authorization='Bearer '+srv.token;
  const body={jsonrpc:'2.0',method};if(params)body.params=params;if(!notify)body.id=++rpcId;
  let r;
  try{r=await fetch(srv.url,{method:'POST',headers:h,body:JSON.stringify(body)})}
  catch{throw new Error('MCP 연결 실패: 주소와 서버의 CORS 설정을 확인하세요')}
  const sid=r.headers.get('mcp-session-id');if(sid)st.sid=sid;
  if(notify)return null;
  if(!r.ok)throw new Error('MCP HTTP '+r.status);
  const txt=await r.text();let msg=null;
  if((r.headers.get('content-type')||'').includes('text/event-stream')){
    for(const line of txt.split('\n'))if(line.startsWith('data:')){const j=safeJSON(line.slice(5).trim());if(j&&j.id===body.id)msg=j}
  }else msg=safeJSON(txt);
  if(!msg)throw new Error('MCP 응답을 해석할 수 없습니다');
  if(msg.error)throw new Error('MCP: '+(msg.error.message||'오류'));
  return msg.result;
}
async function mcpConnect(s){
  MCP[s.id]={};
  try{
    await mcpRPC(s,'initialize',{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'MemoryAll',version:'1.0'}});
    await mcpRPC(s,'notifications/initialized',null,true).catch(()=>{});
    const r=await mcpRPC(s,'tools/list',{});
    MCP[s.id].tools=r?.tools||[];
    return MCP[s.id].tools.length;
  }catch(e){MCP[s.id].err=e.message;throw e}
}
function mcpToolDefs(){
  MCP_MAP={};const out=[];
  S.settings.mcp.forEach((s,i)=>(MCP[s.id]?.tools||[]).forEach(t=>{
    const n=('m'+i+'_'+t.name).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,64);
    MCP_MAP[n]={srv:s,name:t.name};
    out.push({type:'function',function:{name:n,description:String(t.description||t.name).slice(0,1000),parameters:t.inputSchema?.type?t.inputSchema:{type:'object',properties:{}}}});
  }));
  return out.length?out:null;
}
async function mcpCall(n,args){
  const m=MCP_MAP[n];if(!m)throw new Error('알 수 없는 도구: '+n);
  const r=await mcpRPC(m.srv,'tools/call',{name:m.name,arguments:args});
  return (r?.content||[]).map(c=>c.type==='text'?c.text:JSON.stringify(c)).join('\n')||JSON.stringify(r);
}

let PM_LEN={work:1500,break:300};
const PM={mode:'work',left:1500,end:0,run:false,t:0,cycles:0};
function pmLoad(){ // 설정·진행 상태 복원 (새로고침 후에도 이어짐)
  const cl=v=>Math.min(v>180?180:60,Math.max(1,Math.round(+v)||0)); // 분 단위, 범위 제한
  PM_LEN={work:cl(S.settings.pmWork||25)*60,break:cl(S.settings.pmBreak||5)*60};
  try{const c=JSON.parse(localStorage.getItem('memoryall-pomodoro')||'null');if(c){
    PM.mode=c.mode==='break'?'break':'work';PM.cycles=Math.max(0,+c.cycles||0);
    if(c.run&&+c.end>Date.now()){PM.left=Math.ceil((c.end-Date.now())/1000);PM.end=+c.end;PM.run=true;PM.t=setInterval(pmTick,500)}
    else if(c.run&&+c.end){ // 종료 시각이 지남 → 남은 시간을 다음 판에 반영 (예: 집중 끝→휴식 시작)
      let over=Math.floor((Date.now()-+c.end)/1000),m=c.mode==='work'?'break':'work';
      while(over>=PM_LEN[m]){over-=PM_LEN[m];if(m==='work')PM.cycles++;m=m==='work'?'break':'work'}
      PM.mode=m;PM.left=Math.max(1,PM_LEN[m]-over);PM.end=Date.now()+PM.left*1000;PM.run=true;PM.t=setInterval(pmTick,500);
    }
    else PM.left=PM_LEN[PM.mode];
  }}catch{}
}

function pmTick(){
  if(!PM.run)return;
  PM.left=Math.max(0,Math.round((PM.end-Date.now())/1000));

    clearInterval(PM.t);PM.run=false;const was=PM.mode;

  }
  pmDraw();pmSave();
}

  const [r,arg]=curRoute();
  const views={home:vHome,deck:vDeck,study:startStudy,gen:vGen,tutor:vTutor,stats:vStats,calendar:vCalendar,settings:vSettings};
  if(r!=='study')ST=null;
  if(r!=='deck')DQ='';
  renderNav(r==='deck'?'home':views[r]?r:'home');
  (views[r]||vHome)(arg?decodeURIComponent(arg):undefined);
  window.scrollTo(0,0);
}
const go=h=>{if(location.hash===h)route();else location.hash=h};
// 현재 화면만 조용히 다시 그림 (스크롤 유지)
function rerender(){
  if(ST)return drawStudy();
  const [r,a]=curRoute();
  ({deck:vDeck,stats:vStats,home:vHome,calendar:vCalendar}[r]||(()=>{}))(a);
}
function refreshInstall(){const [r]=curRoute();if(r==='home')vHome();else if(r==='settings')vSettings()}

function themeOn(){const t=S.settings.theme||'auto';return t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){document.body.classList.toggle('dark',themeOn());const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',themeOn()?'#0f1218':'#ffffff')}
try{window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme)}catch{}

/* ---------- 캘린더 ---------- */
function vCalendar(){
  const now=new Date();now.setHours(12,0,0,0);
  const y=now.getFullYear(),mo=now.getMonth();
  const W=['일','월','화','수','목','금','토'];
  const first=new Date(y,mo,1),offset=first.getDay(),days=new Date(y,mo+1,0).getDate();
  const todayK=dayKey(),sod=startOfDay();
  let cells='';
  for(let i=0;i<offset;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const t=new Date(y,mo,d,12).getTime(),k=dayKey(t);
    const learned=S.log[k]?.n||0,future=S.cards.filter(c=>c.last&&c.due>=t&&c.due<t+DAY).length;
    cells+=`<div class="${k===todayK?'cal-today':''} ${learned?'cal-done':''}" title="${k}: 학습 ${learned}장 · 예정 ${future}장"><b>${d}</b><span>${learned?ic(I.check):future?`<i class="cal-fut">${future}</i>`:''}</span></div>`;
  }
  const dueToday=S.cards.filter(c=>c.last&&c.due<sod+DAY).length,nwToday=Math.min(deckCounts(null).nw,newLimit());
  const monthLearned=[...Array(days)].reduce((a,_,i)=>a+(S.log[dayKey(new Date(y,mo,i+1,12).getTime())]?.n||0),0);
  M(`<div class="head"><div><h1>캘린더</h1><div class="sub">${y}년 ${mo+1}월 · 이번 달 ${fmtNum(monthLearned)}장 학습</div></div>
  <a class="btn pri" href="#study/all">${ic(I.play)}오늘 학습 (${dueToday+nwToday}장)</a></div>
  <div class="card"><div class="cal-grid">${W.map(w=>`<u>${w}</u>`).join('')}${cells}</div>
  <div class="pills" style="margin-top:12px"><span class="pill g">✔ 학습한 날</span><span class="pill b">숫자 = 그날 복습 예정</span><span class="pill a">테두리 = 오늘</span></div></div>
  <div class="card" style="margin-top:14px"><h2>${ic(I.clock)}이번 주 요약</h2>
  <div class="grid" style="margin-top:6px">${statBox('오늘 학습',(S.log[todayK]?.n||0)+'장','check')}${statBox('복습 대기',dueToday,'clock')}${statBox('새 카드 여분',nwToday,'plus')}${statBox('연속 학습',streak()+'일','flame')}</div></div>`);
}

      <span class="sub">${todayL.n>=g?'달성했습니다! 🎉':`${Math.max(0,g-todayL.n)}장 남았어요`} · 학습 ${fmtDur(todaySecs())} · ${streak()}일 연속 (최고 ${streakBest()}일)</span></div>

  <h2>${ic(I.study)}내 덱 <span class="sub" style="font-weight:400;font-size:12.5px">카드를 다른 덱으로 드래그할 수 있어요</span></h2>
  ${S.decks.length?`<div class="grid">${S.decks.map(d=>{const c=deckCounts(d.id);return `<div class="card deck" data-drop="1" data-id="${esc(d.id)}" data-act="openDeck" draggable="false"><div class="name">${esc(d.name)}</div><div class="pills"><span class="pill b">복습 ${c.due}</span><span class="pill g">새 ${c.nw}</span><span class="pill">전체 ${c.total}</span></div></div>`}).join('')}</div>`
  :`<div class="card empty"><div class="bigic" style="background:var(--accent-soft);color:var(--accent)">${ic(I.study)}</div>아직 덱이 없어요<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="newDeck">${ic(I.plus)}새 덱</button><a class="btn" href="#gen">${ic(I.spark)}AI로 만들기</a></div></div>`}`);
}

/* ---------- 덱 상세 ---------- */
function vDeck(id){
  const d=S.decks.find(x=>x.id===id);if(!d){location.hash='#home';return}
  DS=DS0();DQ='';
  const c=deckCounts(id),st=S.cards.filter(x=>x.deck===id&&x.last);
  const avg=st.length?Math.round(st.reduce((a,x)=>a+x.ef,0)/st.length*100)/100:0;
  const tags=[...new Set(S.cards.filter(x=>x.deck===id).flatMap(x=>x.tags||[]))];
  M(`<div class="head"><div class="row" style="flex-wrap:nowrap;min-width:0"><a class="icon-btn" href="#home">${ic(I.back)}</a><div style="min-width:0"><h1>${esc(d.name)}</h1><div class="pills" style="margin-top:4px"><span class="pill b">복습 ${c.due}</span><span class="pill g">새 ${c.nw}</span><span class="pill">전체 ${c.total}</span>${avg?`<span class="pill a">평균 용이도 ${avg}</span>`:''}</div></div></div>
  <div class="row" style="gap:6px"><a class="btn pri" href="#study/${encodeURIComponent(d.id)}">${ic(I.play)}학습</a><button class="btn" data-act="addCard" data-id="${esc(d.id)}">${ic(I.plus)}추가</button>
  <button class="icon-btn" data-act="import" data-id="${esc(d.id)}" title="가져오기">${ic(I.upload)}</button><button class="icon-btn" data-act="exportDeck" data-id="${esc(d.id)}" title="CSV 내보내기">${ic(I.download)}</button><button class="icon-btn" data-act="renameDeck" data-id="${esc(d.id)}" title="이름 변경">${ic(I.edit)}</button><button class="icon-btn" data-act="delDeck" data-id="${esc(d.id)}" title="덱 삭제">${ic(I.trash)}</button></div></div>
  ${tags.length?`<div class="pills" style="margin-bottom:12px"><span class="tagchip ${!DS.tag&&!DS.star?'on':''}" data-act="dfilter" data-v="">전체</span>${tags.slice(0,20).map(t=>`<span class="tagchip ${DS.tag===t?'on':''}" data-act="dfilter" data-v="${esc(t)}">#${esc(t)}</span>`).join('')}<span class="tagchip ${DS.star?'on':''}" data-act="dstar">${ic(I.star)}즐겨찾기</span></div>`:`<span class="tagchip ${DS.star?'on':''}" data-act="dstar" style="margin-bottom:12px">${ic(I.star)}즐겨찾기</span>`}
  <div class="card"><div class="row" style="gap:8px;margin-bottom:6px;flex-wrap:nowrap"><input id="deckQ" placeholder="카드 검색" value="${esc(DQ)}" style="flex:1">
  <select id="deckSort" style="width:auto;flex-shrink:0">${[['created','최신순'],['due','만료순'],['alpha','가나다'],['lapses','자주 틀림'],['star','즐겨찾기']].map(([k,l])=>`<option value="${k}" ${DS.sort===k?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="dropzone" id="deckDrop" style="display:none;margin-bottom:8px">여기에 CSV/TXT 파일을 놓으면 이 덱에 가져옵니다</div>
  <div class="list" id="cardList"></div><div id="cardPager"></div></div>`);
  drawCardList(id);
  $('#deckQ').addEventListener('input',e=>{DQ=e.target.value;DS.page=1;drawCardList(id)});
  $('#deckSort').addEventListener('change',e=>{DS.sort=e.target.value;DS.page=1;drawCardList(id)});
}
const PAGE_N=50;
function drawCardList(id){
  const box=$('#cardList');if(!box)return;
  const now=Date.now(),q=DQ.toLowerCase();
  let list=S.cards.filter(c=>c.deck===id&&(!q||(c.front+' '+c.back+' '+c.hint+' '+(c.tags||[]).join(' ')).toLowerCase().includes(q)));
  if(DS.tag)list=list.filter(c=>(c.tags||[]).includes(DS.tag));
  if(DS.star)list=list.filter(c=>c.star);
  list=cardSort(list,DS.sort);
  const pages=Math.max(1,Math.ceil(list.length/PAGE_N));DS.page=Math.min(Math.max(1,DS.page),pages);
  const page=list.slice((DS.page-1)*PAGE_N,DS.page*PAGE_N);
  box.innerHTML=page.length?page.map(c=>`<div class="item" draggable="true" data-dragcard="${esc(c.id)}">
  <input type="checkbox" class="chk" data-csel="${esc(c.id)}" ${DS.sel.has(c.id)?'checked':''} style="margin:0">
  <div class="tx"><div class="f">${c.star?`<span style="color:var(--amber)">★</span> `:''}${esc(prev(c.front))}</div>
  <div class="b">${esc(c.back||c.hint||'')}${(c.tags||[]).length?` <span style="color:var(--accent)">#${c.tags.map(esc).join(' #')}</span>`:''}</div></div>
  <button class="icon-btn" data-act="toggleStar" data-id="${esc(c.id)}" title="즐겨찾기">${ic(I.star)}</button>
  ${c.last?`<span class="pill hide-m" title="복습 간격 · 반복 ${c.reps}회 · 틀림 ${c.lapses}회 · 용이도 ${Math.round(c.ef*100)/100}">간격 ${fmtDue(c.iv)}</span>`:''}
  <span class="pill ${!c.last?'g':c.due<=now?'b':''} hide-m">${!c.last?'새 카드':c.due<=now?'복습 대기':Math.ceil((c.due-now)/DAY)+'일 후'}</span>
  <button class="icon-btn" data-act="editCard" data-id="${esc(c.id)}">${ic(I.edit)}</button><button class="icon-btn" data-act="delCard" data-id="${esc(c.id)}">${ic(I.trash)}</button></div>`).join('')
  :`<div class="empty">${q||DS.tag||DS.star?'검색·필터 결과가 없어요':'카드가 없어요. 추가하거나 가져와 보세요'}</div>`;
  const pg=$('#cardPager');
  if(pg)pg.innerHTML=pages>1?`<div class="pager"><button class="mini" data-act="cPage" data-p="${DS.page-1}" ${DS.page<=1?'disabled':''}>${ic(I.back)}이전</button><span class="sub">${DS.page} / ${pages} 페이지 · ${fmtNum(list.length)}장</span><button class="mini" data-act="cPage" data-p="${DS.page+1}" ${DS.page>=pages?'disabled':''}>다음${ic('<path d="m9 6 6 6-6 6"/>')}</button></div>`:'';
  updateSelBar(id);
}
function updateSelBar(id){
  const host=$('#cardList');if(!host)return;
  let bar=$('#selBar');
  if(!DS.sel.size){if(bar)bar.remove();return}
  if(!bar){bar=document.createElement('div');bar.id='selBar';bar.className='selbar';host.parentElement.insertBefore(bar,host)}
  bar.innerHTML=`<span>선택 ${DS.sel.size}장</span><button class="btn sm" data-act="bulkTag" data-id="${esc(id)}">${ic(I.tag)}태그</button>
  <button class="btn sm" data-act="bulkMove" data-id="${esc(id)}">${ic(I.copy)}다른 덱으로</button>
  <button class="btn sm" data-act="bulkStar">${ic(I.star)}즐겨찾기</button>
  <button class="btn sm danger" data-act="bulkDel" data-id="${esc(id)}">${ic(I.trash)}삭제</button>
  <button class="btn sm ghost" data-act="selClear">해제</button>`;
}

/* ---------- 학습 ---------- */
const curCard=()=>ST&&S.cards.find(c=>c.id===ST.q[ST.i]);
const resetCardState=()=>Object.assign(ST,{show:false,hint:false,picked:null,choices:null,typed:null,correct:null});
// 학습 상태 (ST) — 새로고침 후에도 이어서 학습할 수 있도록 localStorage 스냅샷 사용
const STK='memoryall-st';
let ST=null;
function stSave(){try{if(!ST)return;if(ST.q&&ST.q.length&&ST.i<ST.q.length)localStorage.setItem(STK,JSON.stringify({deck:ST.deck,q:ST.q.slice(ST.i),done:ST.done,ok:ST.ok||0,mode:ST.mode,f:ST.f||null,t0:ST.t0}));else localStorage.removeItem(STK)}catch{}}
function stLoad(){try{const d=safeJSON(localStorage.getItem(STK)||'null');if(d&&Array.isArray(d.q)&&d.q.length){const ids=new Set(S.cards.map(c=>c.id));d.q=d.q.filter(id=>ids.has(id));if(!d.q.length){localStorage.removeItem(STK);return null}return d}}catch{}return null}
function startStudy(arg){
  const id=arg&&arg!=='all'?arg:null;
  if(id&&!S.decks.some(d=>d.id===id)){location.hash='#home';return}
  // 저장된 대열이 있고 같은 대상(같은 덱 또는 모두 'all')이면 이어서 학습
  const sv=stLoad();
  if(sv&&((sv.deck||null)===(id||null))){
    ST={deck:id&&S.decks.some(d=>d.id===sv.deck)?sv.deck:(sv.deck||null),q:sv.q,i:0,done:+sv.done||0,ok:+sv.ok||0,mode:sv.mode||S.settings.mode||'flash',f:sv.f||null,t0:+sv.t0||Date.now()};
    resetCardState();drawStudy();return
  }
  ST={deck:id,q:buildQueue(id),i:0,done:0,ok:0,mode:S.settings.mode||'flash',t0:Date.now()};resetCardState();stSave();drawStudy();
}
function makeChoices(c){
  const a=ansText(c);if(!a)return null;
  const pool=[...new Set(shuffle(S.cards.filter(x=>x.id!==c.id)).sort((x,y)=>(y.deck===c.deck)-(x.deck===c.deck)).map(ansText).filter(t=>t&&t!==a))].slice(0,3);
  return pool.length?shuffle([a,...pool]):null;
}
function drawStudy(){
  if(!ST)return;
  while(ST.i<ST.q.length&&!curCard())ST.i++;
  const deck=ST.deck&&S.decks.find(d=>d.id===ST.deck),title=deck?esc(deck.name):'전체 학습',back=deck?'#deck/'+encodeURIComponent(deck.id):'#home';
  const c=curCard();
  if(!c){
    const doneN=ST.done,okN=ST.ok||0,dur=Math.round((Date.now()-(ST.t0||Date.now()))/1000); // 완료 장면을 먼저 계산한 뒤 학습 상태 정리
    if(doneN)logSession({t:Date.now(),deck:ST.deck,n:doneN,ok:okN,dur});
    localStorage.removeItem(STK);ST=null;checkGoal();rerender();
    M(`<div class="head"><div class="row"><a class="icon-btn" href="${back}">${ic(I.back)}</a><h1>${title}</h1></div></div><div class="card empty">
    ${doneN?`<div class="bigic" style="background:#ecfdf5;color:var(--green)">${ic(I.check)}</div><h2 style="justify-content:center">학습 완료</h2><p>${doneN}장을 복습했어요 · 정답 ${Math.round(okN/doneN*100)}% · ${fmtDur(dur)} · 연속 ${streak()}일째!</p>`
    :`<div class="bigic" style="background:var(--accent-soft);color:var(--accent)">${ic(I.clock)}</div><h2 style="justify-content:center">지금 학습할 카드가 없어요</h2><p>새 카드를 추가하거나 AI로 만들어 보세요.</p>`}
    <div class="row" style="justify-content:center;margin-top:18px"><a class="btn" href="#home">홈으로</a><a class="btn pri" href="#gen">${ic(I.spark)}AI로 카드 만들기</a></div></div>`);
    return;
  }
  const a=ansText(c),left=ST.q.length-ST.i,pct=ST.done/(ST.done+left)*100;
  let mode=ST.mode;
  if(mode==='quiz'){if(!ST.choices)ST.choices=makeChoices(c);if(!ST.choices)mode='flash'}
  if(mode==='type'&&!a)mode='flash';
  const aH=c.type==='cloze'?nl(c.front).replace(/\{\{(.+?)\}\}/g,'<span class="cloze">$1</span>')+(c.back?`<div class="sub" style="margin-top:10px">${nl(c.back)}</div>`:''):(nl(c.back)||'<span class="sub">(뒷면 없음)</span>');
  const qH=c.type==='cloze'?nl(c.front).replace(/\{\{(.+?)\}\}/g,'<span class="cloze">[ ? ]</span>'):nl(c.front);
  let act='';
  if(mode==='quiz')act=`<div class="stack" style="gap:8px;margin-bottom:12px">${ST.choices.map((t,i)=>`<button class="btn choice ${ST.show?(t===a?'ok':i===ST.picked?'no':''):''}" data-act="pick" data-i="${i}"><b style="margin-right:6px">${i+1}</b>${nl(t)}</button>`).join('')}</div>`;
  if(mode==='type')act=ST.show&&ST.typed!=null?`<div class="card" style="margin-bottom:12px;padding:12px 14px;border-color:${ST.correct?'var(--green)':'var(--red)'}"><b style="color:${ST.correct?'var(--green)':'var(--red)'}">${ST.correct?'정답':'오답'}</b> · 내 답: ${esc(ST.typed)}</div>`
    :ST.show?'':`<div class="row" style="flex-wrap:nowrap;margin-bottom:12px"><input id="typeIn" placeholder="정답 입력 후 Enter" autocomplete="off"><button class="btn pri" data-act="checkType">확인</button></div>`;
  act+=ST.show?`<div class="gradebar">${[[1,'다시'],[2,'어려움'],[3,'좋음'],[4,'쉬움']].map(([g,l])=>`<button class="btn gr${g}" data-act="grade" data-g="${g}">${l}<small>${fmtIv(c,g)}</small></button>`).join('')}</div>`
    :mode==='type'?`<button class="btn ghost" data-act="reveal" style="width:100%">모르겠어요 · 정답 보기</button>`:`<button class="btn ${mode==='flash'?'pri':''}" data-act="reveal" style="width:100%;padding:13px">${mode==='quiz'?'모르겠어요 · 정답 보기':'정답 보기'}</button>`;
  M(`<div class="head"><div class="row" style="flex-wrap:nowrap"><a class="icon-btn" href="${back}">${ic(I.back)}</a><div><h1>${title}</h1><div class="sub">${ST.done}장 완료 · 남은 ${left}장</div></div></div>
  <div class="row" style="gap:6px">${[['flash','플래시'],['quiz','객관식'],['type','입력']].map(([k,l])=>`<button class="toggle ${ST.mode===k?'on':''}" data-act="mode" data-v="${k}">${l}</button>`).join('')}
  <button class="toggle ${S.settings.reversed?'on':''}" data-act="revMode" title="앞면과 뒷면 교체 (단축키 F)">${ic(I.copy)}뒤집기</button></div></div>
  <div class="progress" style="margin-bottom:16px"><i style="width:${pct}%"></i></div>
  <div class="card flash" id="flash" ${mode==='flash'&&!ST.show?'data-act="reveal"':''}>
    <div>${S.settings.reversed?aH:qH}</div>
    ${ST.hint&&c.hint?`<div class="hint">${ic(I.bulb)}<span>${nl(c.hint)}</span></div>`:''}
    ${ST.show?`<div class="ans">${S.settings.reversed?qH:aH}</div>`:''}

function grade(g){
  if(!ST||!ST.show)return;
  // 덱/카드 삭제(다른 탭 동기화·백업 복원 포함)로 현재 카드가 이미 존재하지 않으면
  // 좀비 카드는 채점·대열에서 제거하고 다음 유효 카드로 넘어간다 (삭제된 덱의 카드 학습 방지)
  {let guard=0;while(ST&&ST.i<ST.q.length&&!S.cards.some(c=>c.id===ST.q[ST.i])){ST.q.splice(ST.i,1);if(++guard>ST.q.length+5)break}}
  if(!ST)return;
  const id=ST.q[ST.i],idx=S.cards.findIndex(c=>c.id===id);
  if(idx<0){ST.i++;resetCardState();stSave();drawStudy();return}
  let ok=g>1;
  if(ST.mode==='quiz'&&ST.choices)ok=ST.picked!=null&&ST.choices[ST.picked]===ansText(curCard()||S.cards[idx]);
  else if(ST.mode==='type'&&ST.typed!=null)ok=!!ST.correct;
  if(idx>-1){
    const isNew=!S.cards[idx].last;
    S.cards[idx]={...nextState(S.cards[idx],g),updated:Date.now()};logReview(ok,isNew);if(ok)ST.ok=(ST.ok||0)+1;save();
    navigator.vibrate?.(g===1?[30,40,30]:15);
    if(g===1)ST.q.splice(Math.min(ST.q.length,ST.i+4),0,id); // 틀린 카드는 몇 장 뒤에 다시
  }else{
    // 카드가 이미 삭제된 상태(좀비 카드) — 채점·기록 없이 대열에서만 제거
    ST.q.splice(ST.i,1);
  }
  ST.done++;ST.i++;resetCardState();stSave();drawStudy();
}
function pick(i){
  if(!ST||ST.show||!ST.choices)return;
  ST.picked=i;ST.show=true;ST.correct=ST.choices[i]===ansText(curCard());
  if(!ST.correct&&curCard()?.type==='cloze')ST.hint=true; // 오답 시 빈칸 답을 힌트로 보여줌
  navigator.vibrate?.(ST.correct?15:[30,40,30]);drawStudy();
}
function checkType(){
  const el=$('#typeIn');if(!ST||ST.show||!el)return;
  const v=el.value.trim();if(!v)return toast('답을 입력하세요');
  const c=curCard();if(!c)return; // 카드가 삭제된 뒤 확인 시도 방지
  const norm=s=>String(s).toLowerCase().replace(/[\s.,!?'"()\-·~]/g,'').trim(),ans=ansText(c);
  const nv=norm(v);
  ST.typed=v;ST.correct=!!nv&&(norm(ans)===nv||ans.split(/[,/;\n]/).map(norm).filter(Boolean).includes(nv));
  ST.show=true;drawStudy();
}

function csvRow(l){
  const o=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','){o.push(cur.trim());cur=''}else cur+=ch}
  o.push(cur.trim());return o;
}
function parseImport(t){
  const lines=String(t).replace(/^\ufeff/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return [];
  const sep=lines[0].includes('\t')?'\t':lines[0].includes('|')?'|':',';
  let rows=lines.map(l=>sep===','?csvRow(l):l.split(sep).map(x=>x.trim()));
  if(/^(front|앞면|question|질문)$/i.test(rows[0][0]))rows.shift();
  // 쉼표 파일에서 앞면에 쉼표가 따옴표 없이 포함됐던 행 복구 (뒷면·힌트를 앞면으로 합침)
  if(sep===',')rows=rows.map(r=>{if(r.length<=3)return r;const[f,b,h,...ex]=r;return [f,[b,h,...ex].filter(Boolean).join(', ')]});
  return rows.filter(r=>r[0]).map(([f,b='',h=''])=>({front:f,back:b,hint:h,type:/\{\{.+?\}\}/.test(f)?'cloze':'basic'}));
}

const TUTOR_SYS='너는 친절한 학습 튜터다. 사용자의 언어로 답한다(기본 한국어). 핵심부터 간결하게 설명하고, 필요하면 예시와 암기법(두문자어, 연상, 이야기)을 제시한다. 퀴즈를 낼 때는 문제만 먼저 내고, 사용자가 답하면 채점하고 해설한다. 도구가 있으면 필요할 때만 사용한다.';
const QUICK=[['쉽게 설명','다음 개념을 아주 쉽게 설명해줘: '],['퀴즈 5문제','다음 주제로 퀴즈 5문제를 하나씩 내줘: '],['암기법','다음 내용을 외우기 쉬운 암기법을 만들어줘: ']];

  <div class="row" style="gap:6px"><button class="toggle ${TUTOR.web?'on':''}" data-act="tWeb">${ic(I.globe)}웹 검색</button><button class="toggle ${TUTOR.mcp?'on':''}" data-act="tMcp">${ic(I.plug)}MCP${n?' '+n:''}</button><button class="icon-btn" data-act="keepChat" title="대화 저장">${ic(I.download)}</button><button class="icon-btn" data-act="chats" title="저장된 대화">${ic(I.clock)}</button><button class="icon-btn" data-act="clearChat" title="대화 지우기">${ic(I.trash)}</button></div></div>

function drawMsgs(){
  const box=$('#msgs');if(!box)return;
  const sb=document.querySelector('[data-act="send"]');if(sb)sb.disabled=TUTOR.busy;
  box.innerHTML=(TUTOR.msgs.length?'':`<div class="empty"><div class="bigic" style="background:var(--accent-soft);color:var(--accent)">${ic(I.chat)}</div>궁금한 것을 물어보거나 아래 버튼으로 시작하세요</div>`)
  +TUTOR.msgs.map((m,i)=>m.role==='u'?`<div class="msg u">${esc(m.text)}</div>`
    :m.role==='t'?`<div class="msg t">${ic(I.plug)}${esc(m.text)}</div>`
    :`<div class="msg a">${md(m.text)}${m.src?`<div class="src">${m.src.map((x,j)=>`<a href="${esc(linkUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>`).join('')}</div>`:''}
      ${m.err?'':`<div class="row" style="margin-top:6px;gap:4px"><button class="btn sm ghost" data-act="toCards" data-i="${i}">${ic(I.plus)}카드로 만들기</button><button class="btn sm ghost" data-act="speakMsg" data-i="${i}">${ic(I.volume)}</button></div>`}</div>`).join('')
  +(TUTOR.busy?`<div class="msg a"><span class="spin"></span></div>`:'');
  box.scrollTop=box.scrollHeight;
}
async function tutorSend(given){
  const el=$('#tIn');
  const text=String(given??el?.value??'').trim();if(!text||TUTOR.busy)return;
  if(el&&given==null){el.value='';el.style.height=''}
  const mark=TUTOR.hist.length;
  TUTOR.msgs.push({role:'u',text});TUTOR.busy=true;drawMsgs();
  try{
    let content=text,src=null;
    if(TUTOR.web){
      try{const r=await webSearch(text.slice(0,200));if(r.length){src=r;content+=`\n\n[웹 검색 결과]\n${fmtResults(r)}\n위 자료를 참고하고, 인용한 부분에는 [번호]를 붙여라.`}}
      catch(e){TUTOR.msgs.push({role:'t',text:'검색 실패: '+e.message});drawMsgs()}
    }
    TUTOR.hist.push({role:'user',content});
    const tools=TUTOR.mcp?mcpToolDefs():null;let out='';
    for(let step=0;step<6;step++){
      let s=Math.max(0,TUTOR.hist.length-30);while(s>0&&TUTOR.hist[s].role!=='user')s--; // 도구 메시지 중간에서 자르지 않음
      const r=await callLLM([{role:'system',content:TUTOR_SYS},...TUTOR.hist.slice(s)],{tools});
      if(!r.calls?.length){out=r.text;break}
      if(step===5){out=r.text||'(도구가 너무 오래 걸려 우선 여기까지의 답으로 정리합니다)';break} // 마지막엔 도구 없이 답 확정
      TUTOR.hist.push({role:'assistant',content:r.text||null,tool_calls:r.calls});
      for(const c of r.calls){
        TUTOR.msgs.push({role:'t',text:'도구 실행: '+(MCP_MAP[c.function.name]?.name||c.function.name)});drawMsgs();
        let res;try{res=await mcpCall(c.function.name,safeJSON(c.function.arguments)||{})}catch(e){res='오류: '+e.message}
        TUTOR.hist.push({role:'tool',tool_call_id:c.id,content:String(res).slice(0,8000)});
      }
    }
    out=out||'(응답이 비어 있습니다)';
    TUTOR.hist.push({role:'assistant',content:out});TUTOR.msgs.push({role:'a',text:out,src});
  }catch(e){TUTOR.hist.length=mark;TUTOR.msgs.push({role:'a',text:'오류: '+e.message,err:true})}
  TUTOR.busy=false;drawMsgs();
}
function weakAsk(){
  const w=weakCards(10);if(!w.length)return toast('아직 약한 카드가 없어요');
  const txt='내가 자주 틀리는 카드들이야. 각각 외우기 쉬운 암기법을 짧게 만들어 주고, 마지막에 확인 퀴즈 3문제를 내줘.\n\n'+w.map((c,i)=>`${i+1}. ${prev(c.front)} → ${ansText(c)}`).join('\n');
  if(curRoute()[0]!=='tutor')location.hash='#tutor';
  tutorSend(txt);
}

function bars(arr){const mx=Math.max(1,...arr.map(x=>x[1]));return `<div class="bars">${arr.map(([l,v])=>`<div><em>${v||''}</em><b style="height:${v/mx*78}%"></b><span>${l}</span></div>`).join('')}</div>`}
function vStats(){
  const W=['일','월','화','수','목','금','토'],noon=startOfDay()+DAY/2,sod=startOfDay(),today=dayKey();

  const heat=[],d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-181);d.setDate(d.getDate()-d.getDay());
  let heatN=0;
  while(dayKey(d.getTime())<=today&&heatN<400){const k=dayKey(d.getTime()),v=S.log[k]?.n||0;heat.push(`<i class="${v?'l'+(v<10?1:v<30?2:v<60?3:4):''}" title="${k}: ${v}장"></i>`);d.setDate(d.getDate()+1);heatN++}
  const past=[],fut=[];
  for(let i=6;i>=0;i--){const t=noon-i*DAY;past.push([i?W[new Date(t).getDay()]:'오늘',S.log[dayKey(t)]?.n||0])}
  for(let i=0;i<7;i++){const a=sod+i*DAY;fut.push([i?W[new Date(a+DAY/2).getDay()]:'오늘',S.cards.filter(c=>c.last&&(i===0||c.due>=a)&&c.due<a+DAY).length])}
  const weak=weakCards(10);

  const byType={basic:0,cloze:0,vocab:0};S.cards.forEach(c=>{byType[c.type]=(byType[c.type]||0)+1});
  M(`<div class="head"><div><h1>통계</h1><div class="sub">꾸준함이 기억을 만듭니다</div></div></div>
  <div class="grid" style="margin-bottom:14px">${statBox('전체 카드',S.cards.length,'study')}${statBox('학습한 카드',S.cards.filter(c=>c.last).length,'check')}${statBox('30일 정답률',n30?Math.round(ok30/n30*100)+'%':'-','chart')}${statBox('연속 학습',streak()+'일','flame')}</div>
  <div class="card" style="margin-bottom:14px"><h2>${ic(I.flame)}학습 기록 (26주)</h2><div class="heat">${heat.join('')}</div></div>
  <div class="two" style="margin-bottom:14px"><div class="card"><h2>${ic(I.chart)}최근 7일</h2>${bars(past)}</div><div class="card"><h2>${ic(I.clock)}복습 예정</h2>${bars(fut)}</div></div>
  ${S.cards.length?`<div class="card" style="margin-bottom:14px"><h2>${ic(I.study)}유형별 구성</h2>
    <div class="pills">${Object.entries(TYPES).map(([k,v])=>`<span class="pill a">${v} ${byType[k]||0}장</span>`).join('')}</div>
    <div class="progress" style="margin-top:10px">${Object.entries(TYPES).map(([k,v],i)=>`<i style="float:left;width:${(byType[k]||0)/S.cards.length*100}%;margin-left:${Object.entries(TYPES).slice(0,i).reduce((a,[kk])=>a+(byType[kk]||0)/S.cards.length*100,0)}%;background:${['var(--accent)','#818cf8','#a5b4fc'][i]||'var(--accent)'}"></i>`).join('')}</div></div>`:''}
  <div class="card"><h2 style="justify-content:space-between"><span class="row" style="gap:8px">${ic(I.alert)}약한 카드</span>${weak.length?`<button class="btn sm" data-act="weakAsk">${ic(I.spark)}AI 암기법 받기</button>`:''}</h2>
  ${weak.length?`<div class="list">${weak.map(c=>`<div class="item"><div class="tx"><div class="f">${esc(prev(c.front))}</div><div class="b">${esc(ansText(c))}</div></div><span class="pill r">틀림 ${c.lapses}</span><button class="icon-btn" data-act="editCard" data-id="${esc(c.id)}">${ic(I.edit)}</button></div>`).join('')}</div>`:'<div class="empty">아직 약한 카드가 없어요</div>'}</div>`);

function setPath(p,v){
  const k=p.split('.');let o=S.settings;
  while(k.length>1)o=o[k.shift()];
  if(p==='newPerDay')v=Math.max(0,Math.min(9999,parseInt(v)||0));
  if(p==='pmWork'){v=Math.min(180,Math.max(1,parseInt(v)||25));S.settings.pmBreak=Math.min(S.settings.pmBreak??5,60);PM_LEN.work=v*60;if(!PM.run&&PM.mode==='work')PM.left=v*60}
  if(p==='pmBreak'){v=Math.min(60,Math.max(1,parseInt(v)||5));PM_LEN.break=v*60;if(!PM.run&&PM.mode==='break')PM.left=v*60}
  o[k[0]]=v;
  if(p==='ai.provider'){const pr=AI_PRESETS[v];if(pr&&v!=='custom'){S.settings.ai.base=pr[1];S.settings.ai.model=pr[2]}}
  save();
  if(p==='pmWork'||p==='pmBreak'){pmSave();pmDraw()}
}

  }
  if(t.id==='typeIn'&&e.key==='Enter'){e.preventDefault();checkType();return}
  if(t.id==='tIn'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();tutorSend();return}
  // 튜터 화면: Esc로 입력창 blur (모바일에서 키보드 닫기 후에도 단축키 사용 가능)
  if(!ST&&t.id==='tIn'&&e.key==='Escape'){t.blur();return}
  if(/INPUT|TEXTAREA|SELECT/.test(tag)||e.ctrlKey||e.metaKey||e.altKey)return;
  // 학습 중이 아닌 화면(튜터 포함)에서도 S = 마지막 AI 답변 듣기
  if(!ST){
    if(curRoute()[0]==='tutor'&&e.code==='KeyS'){const m=[...TUTOR.msgs].reverse().find(x=>x.role==='a');if(m)speak(plainText(md(m.text)));return}
    return;
  }
  if(!curCard())return;
  if(tag==='BUTTON'&&(e.key===' '||e.key==='Enter'))return; // 버튼 기본 클릭과 중복 방지
  if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!ST.show)ACT.reveal();return}
  const n=+e.key;
  if(n>=1&&n<=4){
    if(ST.show)grade(n);
    else if(ST.mode==='quiz'&&ST.choices&&n<=ST.choices.length)pick(n-1);
    return;
  }
  if(e.code==='KeyH')ACT.hint();
  else if(e.code==='KeyS')ACT.speak();
});

/* 데이터 파일 형식 감지 후 가져오기 (Anki TSV/CSV · JSON 백업 · 일반 텍스트) */
function detectImport(text,name){
  const t=String(text??'').replace(/^\ufeff/,''),head=t.trimStart().slice(0,1);
  if(head==='{'||head==='['){const j=safeJSON(t);if(j&&(Array.isArray(j)?j.some(x=>x&&x.front):Array.isArray(j.cards)))return{k:'json',data:j}}
  const lines=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  const sep=lines[0]?.includes('\t')?'\t':lines[0]?.includes(';')&&!lines[0].includes(',')?';':',';
  const rows=(sep===','?lines.map(csvRow):lines.map(l=>l.split(sep).map(x=>x.trim()))).filter(r=>r[0]);
  const hdr=i=>/^front$|^앞면$|^question$|^질문$/i.test(String(rows[i]?.[0]||'').trim());
  let type=-1,back=-1,hint=-1;
  rows.forEach((r,ri)=>{r.forEach((cell,ci)=>{const s=cell.trim().toLowerCase();
    if(s==='type'&&type<0&&ri<=1&&ci>=2)type=ci;
    if(ci>0&&(s==='back'||s==='뒷면'||s==='answer'||s==='답')&&back<0)back=ci;
    if(ci>0&&(s==='hint'||s==='예문'||s==='example'||s==='코멘트'||s==='comment')&&hint<0)hint=ci;})});
  if(hdr(0)&&back<0)back=1;if(hdr(0)&&type>=0&&type!==1)back=type===2?1:2;
  if(back<0)back=1;
  const clean=s=>String(s??'').replace(/^[#\/\/]+\s*/,'').trim();
  const cards=[],seen=new Set(); // 앞면+뒷면 완전 중복 제거 (같은 파일을 두 번 가져와도 카드가 늘지 않음)
  for(const r of rows){
    const f=clean(r[0]);if(!f)continue;
    if(hdr(rows.indexOf(r)))continue;
    let ty=['basic','cloze','vocab'].includes(type>-1?clean(r[type]):'')?(clean(r[type]).toLowerCase()==='cloze'?'cloze':clean(r[type]).toLowerCase()==='vocab'?'vocab':'basic'):(/\{\{.+?\}\}/.test(f)?'cloze':'basic');
    const bk=ty==='cloze'?'':clean(r[back]||''),hk=clean(hint>-1?r[hint]:(r[back+1]||''));
    const key=f+'\u0000'+bk;if(seen.has(key))continue;seen.add(key);
    cards.push({front:f,back:bk,hint:hk,type:ty});
  }
  return cards.length?{k:'cards',data:cards}:null;
}
async function importFiles(files){
  const fs=[...files];if(!fs.length)return;
  const jsons=[],cards=[];let errs=0;
  for(const f of fs){
    let txt='';try{txt=await f.text()}catch{errs++;continue}
    try{
      const d=detectImport(txt,f.name);
      if(!d){errs++;continue}
      if(d.k==='json'){
        if(Array.isArray(d.data))d.data.forEach(x=>{if(x&&x.front)cards.push({front:String(x.front),back:String(x.back??''),hint:String(x.hint??''),type:['basic','cloze','vocab'].includes(x.type)&&(/\{\{.+?\}\}/.test(x.front)||x.type!=='cloze')?x.type:(/\{\{.+?\}\}/.test(x.front)?'cloze':'basic')})});
        else if(Array.isArray(d.data.cards))jsons.push(d.data);
      }else cards.push(...d.data);
    }catch{errs++}
  }
  // JSON 백업 파일은 별도 복원 경로로 (설정까지 있는 경우 확인)
  if(jsons.length){restoreBackup(jsons[0]);return}
  if(!cards.length)return toast(errs?'읽을 수 있는 카드가 없습니다':'파일을 해석할 수 없습니다',4000);
  const box=$('#imText');
  if(box){ // 모달 열림 → 미리보기 채움 (기존 방식 유지)
    box.value=cards.map(c=>[c.front,c.back,c.hint].map(csvCell).join(',')).join('\n');
    toast(`파일 ${fs.length}개 → 카드 ${cards.length}개 변환${errs?` · 실패 ${errs}개`:''}. 가져오기를 누르세요`,4000);return;
  }
  // 모달 밖(드래그&드롭) → 즉시 가져오기
  let dk='';
  if(S.decks.length===1)dk=S.decks[0].id;
  else{const d={id:uid(),name:'가져온 카드 '+dayKey(),created:Date.now()};S.decks.push(d);dk=d.id}
  cards.forEach(c=>S.cards.push(newCard(dk,c.front,c.back,c.hint,c.type)));
  save();toast(`카드 ${cards.length}장 가져왔어요${errs?` · 실패 ${errs}개`:''}`);go('#deck/'+encodeURIComponent(dk));
}

/* 백업 암호화(AES-GCM) · 검증 헤더 */
const ENC_MAGIC='MemoryAll-Enc-v1:';
const PW_SESSION={pw:null};
async function deriveKey(pw,salt){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:15e4,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptText(pw,plain){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plain)));
  const blob=new Uint8Array(salt.length+iv.length+ct.length);blob.set(salt,0);blob.set(iv,16);blob.set(ct,28);
  return ENC_MAGIC+btoa(String.fromCharCode(...blob.subarray(0,4096)))+'@'+btoa(String.fromCharCode(...blob.subarray(4096)));
}
async function decryptText(pw,text){
  const b64=String(text).slice(ENC_MAGIC.length).replace('@','');
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const salt=bin.subarray(0,16),iv=bin.subarray(16,28),ct=bin.subarray(28);
  const key=await deriveKey(pw,salt);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}

async function restoreBackup(d){ // JSON 백업 객체를 검증 후 복원
  if(!d||!Array.isArray(d.decks)||!Array.isArray(d.cards))return toast('올바른 MemoryAll 백업 파일이 아닙니다');
  if(!confirm(`덱 ${d.decks.length}개, 카드 ${d.cards.length}장으로 현재 데이터를 덮어쓸까요?`))return;
  // 삭제 이력 유지: 백업 시점 이후에 삭제된 덱의 카드가 복원으로 되살아나지 않도록 tombstone을 보전한다
  const dt={...(d.delTomb&&typeof d.delTomb==='object'?d.delTomb:{}),...delTomb};
  try{localStorage.setItem(KEY,JSON.stringify({...d,delTomb:dt}));bumpVer()}catch{return toast('저장 공간이 부족합니다')}
  load();save();GEN=GEN0();TUTOR=TUTOR0();PW_SESSION.pw=null;toast('복원 완료');go('#home');
}

/* 오프라인 카드 생성 (AI 없이 제목에서 기본 카드 만들기) */
function offlineGen(){
  syncGen();
  const src=GEN.src.trim();if(!src)return toast('주제나 자료를 입력하세요');
  const n=GEN.count,rule=/[가-힣]/.test(src)?/[.,!?;\n]+/g:/\.\s+|\n/;
  const lines=src.split(rule).map(x=>x.trim()).filter(x=>x.length>=4);
  if(!lines.length)return toast('문장을 찾지 못했어요. 내용을 더 길게 넣어주세요');
  GEN.items=lines.slice(0,n).map(s=>{
    const m=s.match(/^(.{1,40}?)[—:]\s+(.{2,})$/); // "A: B" 형태는 앞/뒤로 분리
    if(m&&GEN.type!=='cloze')return {type:'basic',front:m[1],back:m[2],hint:'',on:true};
    return {type:'basic',front:s.slice(0,80)+(s.length>80?'…':''),back:s,hint:'',on:true};
  });
  toast('오프라인 생성: 문장에서 '+GEN.items.length+'장 추출 (검토 후 저장하세요)');
  vGen();
}

function backupTick(){
  const cfg=S.settings.autoBk;if(!cfg||!cfg.on||!crypto.subtle)return;
  const every=(+cfg.days||7)*DAY,last=+cfg.last||0;
  if(Date.now()-last<every)return;
  const run=async()=>{
    try{
      let text=JSON.stringify(S);
      if(cfg.pw){try{text=await encryptText(cfg.pw,text)}catch{cfg.pw=null;text=JSON.stringify(S)}}
      localStorage.setItem('memoryall-autobk',text);
      cfg.last=Date.now();save();
      toast('자동 백업을 이 브라우저에 저장했어요 ('+new Date().toLocaleDateString('ko-KR')+')',3500);
    }catch{toast('자동 백업 실패: 저장 공간 부족. 수동 백업으로 내보내세요',5000);cfg.on=false;save()}
  };
  run();
}

// 다른 탭과 충돌 없이 병합 (같은 키는 최신 수정 우선, 날짜별 로그는 필드 단위 머지)
function mergeData(a,b){
  const pick=(x,y)=>{const tx=+(x?.updated||x?.created||0),ty=+(y?.updated||y?.created||0);return ty>tx?y:x};
  const decks=Object.create(null);[...(a?.decks||[]),...(b?.decks||[])].forEach(d=>{if(d&&d.id)decks[d.id]=decks[d.id]?pick(decks[d.id],d):d});
  const cards=Object.create(null);[...(a?.cards||[]),...(b?.cards||[])].forEach(c=>{if(c&&c.id)cards[c.id]=cards[c.id]?pick(cards[c.id],c):c});
  const log=Object.create(null);
  for(const src of [a?.log,b?.log]){for(const k in (src||{})){const l=src[k]||{};const o=log[k];
    if(!o){const cp={n:+l.n||0,ok:+l.ok||0,nw:+l.nw||0};if(Array.isArray(l.hs)&&l.hs.length)cp.hs=l.hs.slice(-1000);log[k]=cp} // hs는 '시간 목록'(24개 초과 가능) 또는 '히스토그램'(≤24) → 원본 유지, 이후 병합에서 형식 판별
    else{o.n=Math.max(o.n,+l.n||0);o.ok=Math.max(o.ok,+l.ok||0);o.nw=Math.max(o.nw,+l.nw||0);
      if(Array.isArray(l.hs)&&l.hs.length){
        if(!o.hs)o.hs=l.hs.slice(-1000);
        else{
          const histH=o.hs.length<=24&&l.hs.length<=24; // 둘 다 히스토그램 형태 → 인덱스 합산
          if(histH){const n2=Math.min(24,Math.max(o.hs.length,l.hs.length));const merged=new Array(n2).fill(0);for(let x=0;x<n2;x++){merged[x]=(+o.hs[x]||0)+(+l.hs[x]||0)}o.hs=merged}
          else{o.hs=o.hs.concat(l.hs).slice(-1000)} // 시간 목록 → 단순 연결
        }}}
  }}
  const settings=((a?.settings&&typeof a.settings==='object'?a.settings:b?.settings)||{});
  // 삭제 이력(delTomb) 우선: 한쪽이라도 "이 덱을 안다"(delTomb 없음) = 다른 쪽의 삭제는 되돌림(오동기화 복구)
  // 양쪽 모두 delTomb에 있는 경우에만 진짜 삭제로 간주해 덱과 카드를 함께 제거한다.
  const tA=(a&&a.delTomb&&typeof a.delTomb==='object')?a.delTomb:{};
  const tB=(b&&b.delTomb&&typeof b.delTomb==='object')?b.delTomb:{};
  for(const id of Object.keys(decks)){if(tA[id]&&tB[id])delete decks[id]}
  const aliveDecks=new Set(Object.values(decks).map(d=>d.id));
  const cardsF=Object.values(cards).filter(c=>aliveDecks.has(c.deck));
  return {decks:Object.values(decks),cards:cardsF,log,settings};
}
window.addEventListener('storage',async e=>{
  if(e.key!==KEY)return;
  try{
    const inc=JSON.parse(e.newValue||'null');
    if(!inc){load();route();return}
    let cur=null;try{cur=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
    // 디스크 값이 이상하면 직전 정상 저장본(LAST_GOOD)을 기준으로 병합해 데이터 유실 방지
    if(!cur||!Array.isArray(cur.decks))cur=(LAST_GOOD&&safeJSON(LAST_GOOD))||S;
    // 삭제 이력 합치기 (양쪽 탭의 tombstone 모두 유지)
    const tb={...(cur.delTomb||{}),...(inc.delTomb||{}),...delTomb};
    // 이 탭에서 방금 삭제한 덱은 cur/디스크에 tombstone이 아직 없을 수 있으므로 메모리 사본을 보정해 병합
    const curF=Array.isArray(cur.decks)&&cur.decks.some(d=>delTomb[d.id]&&!cur.delTomb?.[d.id])?{...cur,delTomb:{...(cur.delTomb||{}),...delTomb}}:cur;
    if(curF&&mergeData){const m=mergeData(curF,inc);m.delTomb=tb;localStorage.setItem(KEY,JSON.stringify(m))}
  }catch{}
  const studyId=ST?ST.q[ST.i]:null,studyDeck=ST?ST.deck:null;
  closeModal();GEN=GEN0();TUTOR=TUTOR0();
  load(); // 새 데이터를 디스크에서 다시 읽어온 뒤 현재 화면 유지
  const [r,arg]=curRoute();
  if(r==='study'){
    // 다른 탭에서 학습 중이던 덱/카드가 삭제됐으면 'all'(전체 학습)로 안전하게 대체
    const deckOk=studyDeck&&S.decks.some(d=>d.id===studyDeck);
    startStudy(deckOk?studyDeck:'all');
    if(ST&&studyId){const j=ST.q.indexOf(studyId);if(j>-1)ST.i=j;else ST.i=0} // 삭제된 카드는 대열에 없으므로 앞으로
    drawStudy()
  }
  else route();
  toast('다른 탭의 변경을 반영했어요');
});

// 키보드 단축키 (기존 핸들러 이후에 병합: 검색·도움말·학습 편의키)
document.addEventListener('keydown',e=>{
  if(e.isComposing||e.keyCode===229)return;
  const mod=e.ctrlKey||e.metaKey,t=e.target,tag=t.tagName;
  if(mod&&e.code==='KeyK'){e.preventDefault();if(!$('#modalBg').classList.contains('show'))searchModal();return}
  if(mod||e.altKey)return;
  if(!$('#modalBg').classList.contains('show')&&e.key==='?'&&!(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')){e.preventDefault();helpModal();return}
  if(ST&&!$('#modalBg').classList.contains('show')&&!(tag==='INPUT'||tag==='TEXTAREA'||tag==='BUTTON')){
    if(e.code==='KeyF'){e.preventDefault();ACT.revMode();return}
    if(e.key==='ArrowRight'){e.preventDefault();if(ST.show)grade(3);else{ST.i++;resetCardState();drawStudy()}return}
    if(e.key==='ArrowLeft'){e.preventDefault();ST.i=Math.max(0,ST.i-1);resetCardState();drawStudy();return}
    if(e.code==='KeyN'){e.preventDefault();const c=curCard();ACT.addCard({id:ST.deck||(c&&c.deck)||''});return}
    if(e.code==='KeyD'&&curCard()){e.preventDefault();ACT.delCard({id:curCard().id});return}
    if(isDesktop()&&e.code==='KeyQ'&&ST.mode==='quiz'&&!ST.show&&ST.choices&&ST.choices[0]!=null){e.preventDefault();pick(0);return}
    if(isDesktop()&&e.code==='KeyW'&&ST.mode==='quiz'&&!ST.show&&ST.choices&&ST.choices[1]!=null){e.preventDefault();pick(1);return}
    if(isDesktop()&&e.code==='KeyE'&&ST.mode==='quiz'&&!ST.show&&ST.choices&&ST.choices[2]!=null){e.preventDefault();pick(2);return}
    if(isDesktop()&&e.code==='KeyR'&&ST.mode==='quiz'&&!ST.show&&ST.choices&&ST.choices[3]!=null){e.preventDefault();pick(3);return}
  }
});

// 파일 드래그&드롭 → 가져오기 모달
let dragN=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();dragN++;toast('놓으면 가져옵니다',1500)}});
window.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
window.addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1)});
window.addEventListener('drop',e=>{
  dragN=0;
  const fs=e.dataTransfer?.files;
  if(fs&&fs.length){e.preventDefault();importFiles(fs);return}
  // 텍스트 선택 드래그 → 붙여넣기 지원은 생략 (파일만 처리)
});
